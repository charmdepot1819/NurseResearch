const POSTHOC={
  'One-way ANOVA':'Tukey HSD if variances are equal (Levene p > 0.05). Games-Howell if they are not.',
  'Kruskal-Wallis H test':'Dunn\'s test with Bonferroni correction.',
  'Repeated-measures ANOVA':'Pairwise comparisons between time points with Bonferroni correction.',
  'Friedman test':'Wilcoxon signed-rank tests between pairs of time points, with Bonferroni correction (0.05 ÷ number of comparisons).',
  'Two-way ANOVA':'If the interaction is significant, test simple effects (one variable at each level of the other). If not, run Tukey HSD on any main effect with 3 or more groups.',
  'Mixed (split-plot) ANOVA':'If the group × time interaction is significant, compare the groups at each time point and the time points within each group, with Bonferroni correction.',
  'ANCOVA (analysis of covariance)':'With 3 or more groups, compare the adjusted (estimated marginal) means pairwise with Bonferroni correction.',
  'Chi-square test of independence':'For tables larger than 2×2, look at the adjusted standardized residuals. A cell with |z| > 1.96 differs significantly from what is expected.',
  'Cochran\'s Q test':'McNemar tests between pairs of time points, with Bonferroni correction.'
};
const tname=n=>'the '+(/^(Paired|Independent|One-way|Multiple|Simple|Binary|Ordinal|Repeated|Two-way|Mixed|Chi-square|Generalized)/.test(n)?lc(n):n);
function writeupText(t){
  const T=F.type,iv=T==='correlational'?'[first variable]':T==='predictive'?'[predictors]':T==='quasi'||T==='true'?'[intervention]':'[grouping variable]',dv=T==='correlational'?'[second variable]':'[dependent variable]';
  const L=[];
  L.push('The data will be tallied, encoded and analyzed using [statistical software, e.g. SPSS version __].');
  if(T==='descriptive'){L.push(`${t.name} will be used to describe the [variable] of the respondents. The demographic profile of the respondents will be described using frequency and percentage.`);return L}
  L.push(`The demographic profile of the respondents will be described using frequency and percentage. ${T==='correlational'&&descTool({level:F.iv})!==descTool({level:F.dv})?`${descTool({level:F.iv})} will be used to describe the ${iv}, and ${lc(descTool({level:F.dv}))} to describe the ${dv}`:`${descTool({level:F.dv})} will be used to describe the ${T==='correlational'?iv+' and the ':''}${dv}`}.`);
  const purpose={correlational:`to determine whether there is a significant relationship between the ${iv} and the ${dv}`,comparative:`to determine whether there is a significant difference in the ${dv} when the respondents are grouped according to the ${iv}`,quasi:`to determine the effect of the ${iv} on the ${dv}`,true:`to determine the effect of the ${iv} on the ${dv}`,predictive:`to determine whether the ${iv} significantly predict the ${dv}`}[T];
  const tests=t.both||[t],par=tests.find(x=>x.kind==='p')||(t.alt?t:null);
  if(par&&F.normal!=='no')L.push('Before testing the hypotheses, the normality of the scores will be checked using the Shapiro-Wilk test, where p > 0.05 indicates normally distributed data.');
  if(t.both)L.push(`If the data are normally distributed, ${tname(t.both[0].name)} will be used ${purpose}. If they are not, ${tname(t.both[1].name)} (non-parametric) will be used instead.`);
  else{
    const why=t.kind==='p'?`It is a parametric test, chosen because the ${dv} is measured at the ${F.dv.toLowerCase()} level and the scores are normally distributed.`:t.kind==='np'?`It is a non-parametric test, chosen because ${F.dv==='Nominal'?'the data are counts in categories':F.dv==='Ordinal'?`the ${dv} is measured at the ordinal level`:`the scores are not normally distributed`}.`:'';
    L.push(`${cap(tname(t.name))} will be used ${purpose}. ${why}`.trim());
  }
  const main=tests[0].name,as=ASSUME[main];
  if(as)L.push(`The assumptions of ${tname(main.replace(/ \(.*\)$/,''))} (${as.map(a=>a[0].toLowerCase()).join('; ')}) will be checked before the analysis.`);
  const ph=tests.map(x=>x.name).filter(n=>POSTHOC[n]&&['3i','3p','two','mixed','ancova'].includes(F.groups));
  if(ph.length)L.push(`If a significant result is found, a post hoc test will be done to identify which groups differ: ${ph.map(n=>`${n.replace(/ \(.*\)$/,'')}: ${POSTHOC[n]}`).join(' ')}`);
  if(T==='correlational'&&!/Chi/.test(main))L.push('The strength of the relationship will be interpreted using Cohen\'s guide (Plichta & Kelvin, 2013): about ±0.10 weak, about ±0.30 moderate, and ±0.50 or higher substantial, and its direction as positive or negative.');
  L.push('All hypotheses will be tested at the 0.05 level of significance. The null hypothesis will be rejected if the p-value is less than or equal to 0.05, and not rejected if it is greater than 0.05.');
  return L;
}
function writeupBox(t){
  const L=writeupText(t),html=L.map(x=>`<p>${esc(x).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>')}</p>`).join('');
  const b=el(`<div class="box"><span class="label">Sample write-up</span><h3>Statistical treatment of data</h3><p class="hint">A starting paragraph for Chapter 3. Replace the <span class="ph">[highlighted]</span> parts with your own variables, then adjust it to your study.</p><div class="writeup">${html}</div><div class="row"><button class="ghost" type="button">Copy write-up</button><span class="hint" aria-live="polite"></span></div></div>`);
  const btn=b.querySelector('button'),msg=b.querySelector('.row .hint');
  btn.onclick=()=>{const txt=L.join('\n\n');try{navigator.clipboard.writeText(txt).then(()=>msg.textContent='Copied.',()=>msg.textContent='Select the text above and copy it.')}catch(e){msg.textContent='Select the text above and copy it.'}};
  return b;
}
function postHocBox(names){
  const multi=['3i','3p','two','mixed','ancova'].includes(F.groups);
  const list=names.filter(n=>POSTHOC[n]&&(multi||!n.startsWith('Chi')));if(!list.length||!multi)return null;
  return el(`<div class="box"><span class="label">Post hoc test</span><p>A significant result only says that <b>at least one</b> group or time point differs. A post hoc test shows which ones.</p><ul class="trail">${list.map(n=>`<li><span class="y">→</span><span><b>${esc(n)}</b><br><span class="hint">${esc(POSTHOC[n])}</span></span></li>`).join('')}</ul>${F.groups==='ancova'?'<p class="hint">With only two groups, no post hoc test is needed.</p>':''}<p class="hint">Run a post hoc test only when the main result is significant (p ≤ 0.05).</p></div>`);
}
function assumeBox(names){
  const list=names.filter(n=>ASSUME[n]);if(!list.length)return null;
  return el(`<div class="box"><span class="label">Assumptions to check</span>${list.map(n=>`${list.length>1?`<h3 style="margin-top:4px">${esc(n)}</h3>`:`<p class="hint" style="margin:0">Before reporting <b>${esc(n)}</b>, check that your data meet these:</p>`}<ul class="trail">${ASSUME[n].map(([a,h])=>`<li><span class="q">✓</span><span><b>${esc(a)}</b><br><span class="hint">${esc(h)}</span></span></li>`).join('')}</ul>`).join('')}<p class="hint">${list.some(n=>/t-test|ANOVA|Pearson/.test(n))?'If a parametric assumption fails (usually normality), switch to the non-parametric test. ':''}Report the assumption checks in your results chapter.</p></div>`);
}


// ---------- (i) details for each option box ----------
const INFO={
 'type:descriptive':'Describes what exists without testing relationships or giving an intervention. Example: level of knowledge of mothers on breastfeeding. Uses frequency, percentage, mean or weighted mean. No hypothesis is needed.',
 'type:correlational':'Tests whether two variables are related, without manipulating anything. Example: relationship between sleep hours and GPA. It shows association, not cause. Common tests: Pearson r, Spearman rho, chi-square.',
 'type:comparative':'Compares groups that already exist, such as male vs female or day vs night shift, with no intervention. Also called causal-comparative or ex post facto. Common tests: t-test, ANOVA, Mann-Whitney U, Kruskal-Wallis.',
 'type:quasi':'The researcher gives an intervention but does not randomly assign participants. Example: one ward gets a new protocol and another does not, or one group is measured before and after. Common tests: paired or independent t-test, ANOVA, or their non-parametric versions.',
 'type:true':'Has all three: manipulation (you give the intervention), a control group, and random assignment to groups. Random assignment is different from random sampling, which is preferred but not required. It is the strongest design for cause and effect. Example: patients randomly assigned to a cold compress or usual care.',
 'type:predictive':'Tests which of several variables predict an outcome. Example: do age, BMI and activity level predict blood pressure? Common tests: multiple linear regression for a numeric outcome, logistic regression for a yes/no outcome.',
 'level:Nominal':'Names or labels with no order. You can only count them. Examples: sex, blood type, civil status, yes/no answers. Summarize with frequency and percentage; test with chi-square.',
 'level:Ordinal':'Categories with a meaningful order but unequal gaps. Examples: pain as mild, moderate or severe; year level; a single Likert item. Summarize with median or weighted mean; use non-parametric tests.',
 'level:Interval':'Equal gaps between values but no true zero. Examples: temperature in °C, total score on a questionnaire. Summarize with mean and standard deviation; use parametric tests if the data are normal.',
 'level:Ratio':'Equal gaps and a true zero, so "twice as much" makes sense. Examples: age, weight, pulse rate, number of falls. Summarize with mean and standard deviation; use parametric tests if the data are normal.',
 'groups:2i':'Two separate sets of people, each measured on the outcome. Example: intervention group vs control group. Tests: independent t-test (parametric) or Mann-Whitney U (non-parametric).',
 'groups:2p':'The same people measured twice, usually before and after an intervention, so the scores come in pairs. Tests: paired t-test (parametric) or Wilcoxon signed-rank (non-parametric).',
 'groups:3i':'Three or more separate groups. Example: nurses on day, evening and night shifts. Tests: one-way ANOVA (parametric) or Kruskal-Wallis H (non-parametric). A significant result needs a post hoc test to see which groups differ.',
 'groups:ancova':'Usually an intervention group and a control group measured before and after. ANCOVA compares the posttest scores while statistically removing differences in the pretest. This is useful in quasi-experiments where groups did not start out equal.',
 'groups:mixed':'Two or more groups, each measured three or more times, such as intervention and control at pretest, posttest and follow-up. Mixed ANOVA tests the group effect, the time effect and whether the groups change differently over time (interaction).',
 'groups:two':'Two grouping variables at once, such as sex (male, female) and shift (day, night). Two-way ANOVA tests each variable and whether they interact.',
 'sampling:simple':'Every member of the population has an equal chance. List everyone, then draw names by lottery or a random number generator. Results generalize best.',
 'sampling:systematic':'Divide the population size by the sample size to get k, pick a random start, then take every kth person on the list.',
 'sampling:stratified':'Split the population into subgroups (year level, ward, sex), then randomly sample from each, usually in proportion to its size. Ensures every subgroup is represented.',
 'sampling:cluster':'Randomly select whole groups (wards, sections, schools) and include everyone in them. Practical when the population is spread out.',
 'sampling:census':'Include everyone when the population is small, for example all 60 nurses in one hospital. Also called total population sampling.',
 'sampling:purposive':'Choose respondents who meet your inclusion criteria, such as patients with type 2 diabetes for at least one year. Common in quasi-experiments.',
 'sampling:convenience':'Include whoever is available and willing during data collection. Easy, but the sample may not represent the population.',
 'sampling:quota':'Like stratified sampling, but respondents in each subgroup are chosen non-randomly until the quota is filled.',
 'sampling:snowball':'Each respondent refers others who qualify. Used for hard-to-reach groups, such as nurses who left the profession.',
 'npred:1':'Only one independent variable predicts the outcome. Use simple linear regression for a numeric outcome.',
 'npred:many':'Two or more independent variables predict the outcome together. Use multiple linear regression for a numeric outcome.',
 'groups:3p':'The same people measured three or more times. Example: pain scores at baseline, week 4 and week 8. Tests: repeated-measures ANOVA (parametric) or Friedman test (non-parametric).',
 'normal:yes':'The scores form a roughly bell-shaped curve. Check with the Shapiro-Wilk test (p > 0.05 means normal) or a histogram. Normal data let you use parametric tests.',
 'normal:no':'Shapiro-Wilk gives p ≤ 0.05, or the histogram is clearly skewed. Use the non-parametric test, which compares ranks instead of means.',
 'normal:unsure':'You can only check normality after collecting data. The app shows both tests so you can write your plan, for example: "paired t-test if normal, otherwise Wilcoxon signed-rank".',
 'goal:describe':'Describes the level or profile of your variables. Leads to a descriptive survey design and descriptive statistics only.',
 'goal:relate':'Tests whether two variables move together. Leads to a correlational design and Pearson r, Spearman rho or chi-square.',
 'goal:compare':'Compares groups that already exist, with no intervention. Leads to a comparative design and a t-test, ANOVA or their non-parametric versions.',
 'goal:effect':'Tests whether an intervention changes an outcome. Leads to a true experimental or quasi-experimental design.',
 'goal:predict':'Tests which variables predict an outcome. Leads to a predictive correlational design and regression.',
 'assign:random':'Chance decides who goes into each group, for example drawing lots or using random numbers. This makes the design true experimental.',
 'assign:nonrandom':'Groups are formed some other way, such as existing wards or sections, or there is only one group. This makes the design quasi-experimental.'
};

// ---------- Power analysis math (a priori, G*Power 3.1 formulas) ----------
const PM=(()=>{
  function lgamma(x){const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
    if(x<0.5)return Math.log(Math.PI/Math.sin(Math.PI*x))-lgamma(1-x);x-=1;let a=c[0];const t=x+g+0.5;for(let i=1;i<9;i++)a+=c[i]/(x+i);return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a)}
  function betacf(a,b,x){const MAXIT=300,EPS=1e-14,FPMIN=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;
    for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;
      aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break}return h}
  function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
    return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
  function gammp(a,x){if(x<=0)return 0;if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<500;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-15)break}return sum*Math.exp(-x+a*Math.log(x)-lgamma(a))}
    let b=x+1-a,c=1/1e-300,d=1/b,h=d;for(let i=1;i<500;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-15)break}
    return 1-Math.exp(-x+a*Math.log(x)-lgamma(a))*h}
  const fcdf=(x,d1,d2)=>x<=0?0:ibeta(d1*x/(d1*x+d2),d1/2,d2/2);
  const chicdf=(x,k)=>gammp(k/2,x/2);
  function poisMix(h,term){if(h<=0)return term(0);const j0=Math.floor(h);let s=0;
    for(let j=j0;j>=0;j--){const w=Math.exp(-h+j*Math.log(h)-lgamma(j+1)),t=w*term(j);s+=t;if(w<1e-15&&j<j0)break}
    for(let j=j0+1;j<j0+10000;j++){const w=Math.exp(-h+j*Math.log(h)-lgamma(j+1));s+=w*term(j);if(w<1e-15)break}return s}
  const ncfcdf=(x,d1,d2,lam)=>{if(x<=0)return 0;const y=d1*x/(d1*x+d2);return poisMix(lam/2,j=>ibeta(y,d1/2+j,d2/2))};
  const ncchicdf=(x,k,lam)=>x<=0?0:poisMix(lam/2,j=>gammp(k/2+j,x/2));

const ARE=3/Math.PI; // asymptotic relative efficiency, normal parent (G*Power default)
// t-test power via t^2 ~ F(1, df, delta^2)
function tPower(delta,df,alpha,tails){
  const p=tails===2?1-alpha:1-2*alpha;
  const fc=PM.quant(x=>PM.fcdf(x,1,df),p);
  return{power:1-PM.ncfcdf(fc,1,df,delta*delta),crit:Math.sqrt(fc)};
}
const GP_TESTS={
  tind:{l:'Independent samples t-test',g:'2 independent groups, parametric',es:'d',groups:2,
    calc:(n,o)=>{const d=o.es,delta=d*Math.sqrt(n*n/(2*n)),df=2*n-2,r=tPower(delta,df,o.alpha,o.tails);return{...r,delta,df,N:2*n,per:n,critLabel:'Critical t'}},min:2},
  tpair:{l:'Paired samples t-test',g:'Same group measured twice, parametric',es:'dz',
    calc:(n,o)=>{const delta=o.es*Math.sqrt(n),df=n-1,r=tPower(delta,df,o.alpha,o.tails);return{...r,delta,df,N:n,critLabel:'Critical t'}},min:2},
  wmw:{l:'Mann-Whitney U test',g:'2 independent groups, non-parametric',es:'d',groups:2,
    calc:(n,o)=>{const delta=o.es*Math.sqrt(n*n*ARE/(2*n)),df=2*n*ARE-2,r=tPower(delta,df,o.alpha,o.tails);return{...r,delta,df,N:2*n,per:n,critLabel:'Critical t'}},min:3},
  wsr:{l:'Wilcoxon signed-rank test',g:'Same group measured twice, non-parametric',es:'dz',
    calc:(n,o)=>{const delta=o.es*Math.sqrt(n*ARE),df=n*ARE-1,r=tPower(delta,df,o.alpha,o.tails);return{...r,delta,df,N:n,critLabel:'Critical t'}},min:3},
  anova:{l:'One-way ANOVA',g:'3 or more independent groups, parametric',es:'f',k:true,
    calc:(N,o)=>{const d1=o.k-1,d2=N-o.k,lam=o.es*o.es*N,fc=PM.quant(x=>PM.fcdf(x,d1,d2),1-o.alpha);return{power:1-PM.ncfcdf(fc,d1,d2,lam),crit:fc,lam,d1,d2,N,per:N/o.k,critLabel:'Critical F'}},min:o=>o.k+1},
  kw:{l:'Kruskal-Wallis H test',g:'3 or more independent groups, non-parametric',es:'f',k:true,approx:true},
  corr:{l:'Pearson correlation (r)',g:'Relationship between 2 variables',es:'r',
    calc:(N,o)=>{const z=Math.atanh(Math.abs(o.es))+Math.abs(o.es)/(2*(N-1)),zc=PM.zq(1-o.alpha/(o.tails===2?2:1));return{power:PM.ncdf(z*Math.sqrt(N-3)-zc),crit:zc,fz:z,N,critLabel:'Critical z'}},min:5},
  reg:{l:'Multiple linear regression',g:'Several predictors, numeric outcome',es:'f2',pred:true,
    calc:(N,o)=>{const d1=o.p,d2=N-o.p-1,lam=o.es*N,fc=PM.quant(x=>PM.fcdf(x,d1,d2),1-o.alpha);return{power:1-PM.ncfcdf(fc,d1,d2,lam),crit:fc,lam,d1,d2,N,critLabel:'Critical F'}},min:o=>o.p+3},
  chi:{l:'Chi-square test',g:'Nominal variables (goodness of fit or contingency table)',es:'w',dfin:true,
    calc:(N,o)=>{const lam=o.es*o.es*N,cc=PM.quant(x=>PM.chicdf(x,o.df),1-o.alpha);return{power:1-PM.ncchicdf(cc,o.df,lam),crit:cc,lam,d1:o.df,N,critLabel:'Critical χ²'}},min:5}
};
function gpSolve(key,o){
  const T=GP_TESTS[key];
  if(key==='kw'){const r=gpSolve('anova',o);if(!r)return null;const N=Math.ceil(r.N/ARE/o.k)*o.k;return{...r,N,per:N/o.k,kwFrom:r.N,approx:true}}
  if(!(o.es>0))return null;
  if(key==='corr'&&Math.abs(o.es)>=1)return null;
  let lo=typeof T.min==='function'?T.min(o):T.min,hi=lo,r=T.calc(hi,o);
  while(r.power<o.power){lo=hi;hi*=2;if(hi>2e6)return null;r=T.calc(hi,o)}
  if(T.calc(lo,o).power>=o.power)hi=lo;
  while(hi-lo>1){const m=Math.floor((lo+hi)/2);if(T.calc(m,o).power>=o.power)hi=m;else lo=m}
  if(T.k){const N=Math.ceil(hi/o.k)*o.k;return T.calc(N,o)}
  return T.calc(hi,o);
}

  dz:{name:'Cohen\'s dz',conv:[['Small',0.2],['Medium',0.5],['Large',0.8]],info:'The mean of the before-after differences divided by the standard deviation of those differences.'},

    gr.innerHTML=`<div class="result"><span class="label">Minimum sample size</span><p class="big" style="font-size:3rem;font-variant-numeric:tabular-nums">${r.N.toLocaleString('en-US')}</p><p>${r.per!=null?`${r.per.toLocaleString('en-US')} per group · `:''}total respondents needed</p><p class="hint">With 10% added for dropouts or incomplete answers: <b>${Math.ceil(r.N*1.1).toLocaleString('en-US')}</b>.</p></div>
    <div class="box"><span class="label">Output (as shown in G*Power)</span><div class="tbl"><table style="min-width:0"><tbody>${rows.map(([a,b])=>`<tr><td>${esc(a)}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${esc(b)}</td></tr>`).join('')}</tbody></table></div>
    ${GP.test==='corr'?'<p class="hint">Correlation uses a close approximation of G*Power\'s exact method. Results normally match; check in G*Power if it differs by one.</p>':''}
    ${GP.test==='kw'?`<p class="hint">G*Power has no Kruskal-Wallis option. This takes the one-way ANOVA result (${r.kwFrom}) and divides it by the efficiency of rank tests (0.955), rounded up to equal groups. Treat it as an estimate.</p>`:''}
    ${['wmw','wsr'].includes(GP.test)?'<p class="hint">Uses G*Power\'s A.R.E. method with a normal parent distribution.</p>':''}</div>
    <div class="box"><span class="label">For your methodology</span><p id="gp-sent">${esc(sentence)}</p><p class="hint">If your program requires G*Power itself, enter the same values in G*Power 3.1 to confirm the result and cite it.</p><div class="row"><button class="ghost" id="gp-copy">Copy sentence</button><span class="hint" id="gp-cmsg"></span></div></div>`;
    $('#gp-copy').onclick=()=>{try{navigator.clipboard.writeText(sentence).then(()=>{$('#gp-cmsg').textContent='Copied.'},()=>{selectText()})}catch(e){selectText()}};
    function selectText(){const rg=document.createRange();rg.selectNodeContents($('#gp-sent'));const s=getSelection();s.removeAllRanges();s.addRange(rg);$('#gp-cmsg').textContent='Copying is blocked here. The sentence is selected, so copy it manually.'}
  };
  draw();
}

function renderHyp(){

  $('#app').innerHTML=`<section class="hero"><span class="label">After you run your test</span><h1>Hypothesis testing and p-values</h1><p>Enter the p-value from your statistical software. The app compares it with your level of significance (α), tells you whether to reject or fail to reject the null hypothesis, and writes the conclusion.</p></section>
  <div class="layout"><div class="work" id="hw"></div><aside class="guide" id="hr"></aside></div>
  <section class="section"><div class="layout"><div class="work">
    <div class="box"><h3>Steps of hypothesis testing</h3><ol>
      <li><b>State the hypotheses.</b> The null hypothesis (H₀) says there is no relationship, difference or effect. The alternative hypothesis (H₁) says there is.</li>
      <li><b>Set the level of significance (α).</b> Usually 0.05, meaning you accept a 5% risk of rejecting H₀ when it is actually true.</li>
      <li><b>Choose the statistical test</b> that fits your design and variables. Use the <a href="#home">test finder</a>.</li>
      <li><b>Compute the test statistic and p-value</b> with software such as SPSS, Jamovi, JASP or Excel.</li>
      <li><b>Decide.</b> If p ≤ α, reject H₀. If p &gt; α, fail to reject H₀.</li>
      <li><b>Conclude</b> in words related to your research question.</li></ol></div>
    <div class="box"><h3>Decision rule</h3><div class="tbl"><table style="min-width:0"><thead><tr><th>p-value</th><th>Decision</th><th>Result</th><th>What it means</th></tr></thead><tbody>
      <tr><td>p ≤ α</td><td><b>Reject H₀</b></td><td>Significant</td><td>The data support H₁. The relationship, difference or effect is unlikely to be due to chance.</td></tr>
      <tr><td>p &gt; α</td><td><b>Fail to reject H₀</b></td><td>Not significant</td><td>The data do not give enough evidence for H₁. This does not prove H₀ is true.</td></tr></tbody></table></div></div>
  </div><aside class="guide">
    <div class="box soft"><h3>"Accept" or "fail to reject"?</h3><p>Say <b>fail to reject H₀</b>, not "accept H₀". A non-significant result means you did not find enough evidence, not that you proved there is no difference. Some schools still write "accept H₀". Follow your adviser's format, but know what it means.</p><p>When you reject H₀, you can say the alternative hypothesis is <b>supported</b> (or accepted).</p></div>
    <div class="box"><h3>Type I and Type II errors</h3><ul><li><b>Type I error (α):</b> rejecting H₀ when it is actually true. A false positive.</li><li><b>Type II error (β):</b> failing to reject H₀ when it is actually false. A false negative. Power (1 − β) is the chance of avoiding it, which is why sample size matters.</li></ul></div>
  </aside></div></section>`;
  const w=$('#hw');

    w.innerHTML='';
    const b1=el(`<div class="box"><span class="label">1 · Your hypothesis</span><h3>What does your hypothesis test?</h3><div class="choices"></div>

    w.append(b1);
    const b2=el(`<div class="box"><span class="label">2 · Your result</span><div class="calc">
      <div class="field"><label for="h-test">Statistical test used</label><select id="h-test"><option value="">Choose…</option>${HTESTS.map(t=>`<option ${H.test===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label for="h-alpha">Level of significance (α)</label><select id="h-alpha">${['0.01','0.05','0.10'].map(v=>`<option ${H.alpha===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="h-p">p-value (Sig.)</label><input type="number" id="h-p" min="0" max="1" step="any" inputmode="decimal" value="${esc(H.p)}" placeholder="e.g. 0.032"></div>
      <div class="field"><label for="h-stat">${H.test.includes('correlation')?'Correlation coefficient (r or rho)':'Test statistic value'} <span class="hint">(optional)</span></label><input type="number" id="h-stat" step="any" value="${esc(H.stat)}" placeholder="${H.test.includes('correlation')?'e.g. 0.45':'e.g. 2.31'}"></div></div>
      <p class="hint">SPSS shows the p-value as "Sig." If it shows .000, report it as p &lt; .001.</p></div>`);
    w.append(b2);
    const bind=(id,k,ev)=>{const x=w.querySelector(id);x[ev]=e=>{H[k]=e.target.value;hsave();ev==='onchange'?draw():result()}};
    bind('#h-x','x','oninput');bind('#h-y','y','oninput');bind('#h-p','p','oninput');bind('#h-stat','stat','oninput');bind('#h-test','test','onchange');bind('#h-alpha','alpha','onchange');
    result();
  };
  const result=()=>{
    const hr=$('#hr'),K=HKINDS[H.kind];
    const x=H.x.trim()||ph(H.kind==='difference'?'grouping variable':H.kind==='effect'?'intervention':H.kind==='prediction'?'predictors':'variable 1'),y=H.y.trim()||ph(H.kind==='relationship'||H.kind==='association'?'variable 2':'outcome');
    const p=Number(H.p),a=Number(H.alpha),hasP=H.p!==''&&isFinite(p);
    let html='';
    if(K)html+=`<div class="box"><span class="label">Your hypotheses</span><p><b>H₀:</b> ${esc(K.h0(x,y))}</p><p><b>H₁:</b> ${esc(K.h1(x,y))}</p></div>`;
    if(!hasP){hr.innerHTML=`<div class="result" style="border-style:dashed;border-color:var(--line)"><span class="label">Decision</span><p class="big" style="color:var(--muted)">Enter your p-value</p><p class="hint">${K?'Type the p-value from your software in step 2.':'Choose what your hypothesis tests, then enter the p-value.'}</p></div>`+html;return}

      <div class="pline" aria-hidden="true"><div class="preg" style="width:${apos}%"></div><div class="pmark" style="left:${pos}%"><span>p</span></div><div class="amark" style="left:${apos}%"></div></div>

      <p class="hint">Shaded area: the rejection region (p ≤ α).</p></div>`+html+
      (K?`<div class="box"><span class="label">Conclusion for your paper</span><p id="h-sent">${esc(sentence)}</p><div class="row"><button class="ghost" id="h-copy">Copy</button><span class="hint" id="h-cmsg"></span></div></div>`:'');

const TERM_CATS=['Research process','Variables and measurement','Sampling','Instruments','Research designs','Statistics','Ethics'];
const TERMS=[
 ['Research process','Research problem','A gap, issue or situation in practice or knowledge that a study tries to address.','Many post-op patients develop pressure injuries despite repositioning.'],
 ['Research process','Research question','A clear, answerable question that guides the study, often written as a statement of the problem with specific questions.',''],
 ['Research process','Hypothesis','A testable prediction about the relationship or difference between variables.',''],
 ['Research process','Null hypothesis (H₀)','States that there is no relationship, difference or effect. It is what the statistical test evaluates.','There is no significant difference in anxiety before and after music therapy.'],
 ['Research process','Alternative hypothesis (H₁)','States that there is a relationship, difference or effect. It is supported when H₀ is rejected.',''],
 ['Research process','Directional hypothesis','A hypothesis that predicts the direction of the result, such as higher or lower. Tested one-tailed.',''],
 ['Research process','Review of related literature','A critical summary of published studies and theories on the topic. It shows what is known and where the gap is.',''],
 ['Research process','Conceptual framework','A diagram or explanation of how the study\'s concepts and variables are related, often drawn as independent variable → dependent variable.',''],
 ['Research process','Theoretical framework','The established theory the study is based on, such as Orem\'s Self-Care Deficit Theory or Pender\'s Health Promotion Model.',''],
 ['Research process','Operational definition','States exactly how a variable will be measured in the study.','Anxiety is the score on the State-Trait Anxiety Inventory.'],
 ['Research process','Scope and delimitation','What the study covers (scope) and the boundaries the researcher deliberately set (delimitation), such as setting, population and time.',''],
 ['Research process','Limitation','A weakness outside the researcher\'s control that may affect the results, such as a small sample or self-reported data.',''],
 ['Research process','Pilot study','A small-scale trial run of the study, done before the main data collection, to test the instrument, procedures and timing. It is often done with about 10% of the planned sample from a similar but separate group.','Giving the questionnaire to 15 nurses from another hospital to check that items are clear.'],
 ['Research process','Pretest (of an instrument)','Trying out a questionnaire on a few people like your respondents to check clarity and length. Different from the pretest measurement in an experiment.',''],
 ['Research process','Data gathering procedure','The step-by-step process of collecting data, from getting permission to retrieving the questionnaires.',''],
 ['Variables and measurement','Variable','A characteristic that can take different values among respondents, such as age or pain score.',''],
 ['Variables and measurement','Independent variable','The presumed cause, the intervention or the factor being compared.',''],
 ['Variables and measurement','Dependent variable','The outcome that is measured and expected to change.',''],
 ['Variables and measurement','Extraneous variable','Any other factor that could affect the dependent variable. If it actually distorts the result, it is a confounding variable.',''],
 ['Variables and measurement','Confounding variable','A factor linked to both the independent and dependent variable that offers another explanation for the result.',''],
 ['Variables and measurement','Demographic profile','Characteristics of respondents, such as age, sex, civil status and years of experience.',''],
 ['Variables and measurement','Nominal scale','Categories with no order, such as sex or blood type.',''],
 ['Variables and measurement','Ordinal scale','Ordered categories with unequal gaps, such as mild, moderate and severe.',''],
 ['Variables and measurement','Interval scale','Equal gaps between values but no true zero, such as temperature in °C.',''],
 ['Variables and measurement','Ratio scale','Equal gaps and a true zero, such as weight or pulse rate.',''],
 ['Variables and measurement','Likert scale','A rating scale where respondents choose their level of agreement or frequency, such as 1 (strongly disagree) to 5 (strongly agree).',''],
 ['Sampling','Population','The whole group the researcher wants to draw conclusions about.',''],
 ['Sampling','Sample','The subset of the population who actually take part in the study.',''],
 ['Sampling','Sampling frame','The actual list of population members from which the sample is drawn.','The hospital\'s list of all 380 staff nurses.'],
 ['Sampling','Inclusion criteria','Characteristics a person must have to be part of the study.','Staff nurses with at least 1 year of experience.'],
 ['Sampling','Exclusion criteria','Characteristics that disqualify a person who otherwise meets the inclusion criteria.','Nurses on leave during data collection.'],
 ['Sampling','Random assignment','Using chance to decide which group (intervention or control) each participant joins. It is what makes a study a true experiment or RCT. It is different from random sampling, which decides who is in the study.',''],
 ['Sampling','Simple random sampling','Every member of the population has an equal chance of being chosen, for example by drawing lots or using random numbers.',''],

 ['Sampling','Purposive sampling','Choosing respondents who meet specific criteria set by the researcher.',''],

 ['Sampling','Power analysis','A way of computing the sample size needed to detect an effect of a given size, at a chosen α and power, often done with G*Power.',''],

 ['Instruments','Content validity','Whether the items cover the whole concept, usually judged by a panel of experts.',''],

 ['Instruments','Adopted instrument','A published instrument used as it is, with permission from the author.',''],
 ['Instruments','Modified instrument','A published instrument changed to fit the study, which then needs validation again.',''],
 ['Research designs','Quantitative research','Research that collects numerical data and analyzes it with statistics to describe, find relationships or test effects.',''],
 ['Research designs','Descriptive design','Describes variables as they are, without manipulation or testing relationships.',''],
 ['Research designs','Correlational design','Tests whether two or more variables are related, without manipulation.',''],
 ['Research designs','Comparative design','Compares groups that already exist on an outcome, with no intervention. Also called causal-comparative or ex post facto.',''],
 ['Research designs','Quasi-experimental design','Tests an intervention without random assignment to groups.',''],
 ['Research designs','True experimental design','Tests an intervention with manipulation, a control group and random assignment.',''],
 ['Research designs','Randomized controlled trial (RCT)','A true experiment in which participants are randomly assigned to intervention or control groups.',''],
 ['Research designs','Control group','The group that does not receive the intervention, used for comparison.',''],
 ['Research designs','Cross-sectional','Data are collected at one point in time.',''],
 ['Research designs','Longitudinal','Data are collected from the same people at several points in time.',''],
 ['Research designs','Internal validity','Confidence that the independent variable, not something else, caused the change in the dependent variable.',''],
 ['Research designs','External validity','How far the results can be generalized to other people and settings.',''],
 ['Statistics','Descriptive statistics','Summarize the data, such as frequency, percentage, mean and standard deviation.',''],
 ['Statistics','Inferential statistics','Test hypotheses and let you generalize from the sample to the population, such as the t-test or Pearson r.',''],
 ['Statistics','Mean','The average of the scores.',''],
 ['Statistics','Weighted mean','The average of Likert responses where each response is multiplied by its weight, usually paired with a verbal interpretation.',''],
 ['Statistics','Standard deviation','How spread out the scores are around the mean.',''],
 ['Statistics','Level of significance (α)','The risk of rejecting a true null hypothesis that the researcher accepts, usually 0.05.',''],
 ['Statistics','p-value','The probability of getting results at least this extreme if the null hypothesis were true. If p ≤ α, reject H₀.',''],
 ['Statistics','Statistical significance','A result is significant when p ≤ α, meaning it is unlikely to be due to chance alone.',''],
 ['Statistics','Type I error','Rejecting the null hypothesis when it is actually true. A false positive.',''],
 ['Statistics','Type II error','Failing to reject the null hypothesis when it is actually false. A false negative.',''],
 ['Statistics','Power (1 − β)','The probability that a test will detect an effect that really exists. Usually set at 0.80.',''],
 ['Statistics','Effect size','How large a difference or relationship is, regardless of sample size, such as Cohen\'s d or r.',''],
 ['Statistics','Parametric test','A test that assumes interval or ratio data that are normally distributed, such as the t-test, ANOVA or Pearson r.',''],
 ['Statistics','Non-parametric test','A test that does not assume normal data, used for ordinal or skewed data, such as Mann-Whitney U or Spearman rho.',''],
 ['Statistics','Normal distribution','A symmetric, bell-shaped spread of scores. Checked with the Shapiro-Wilk or Kolmogorov-Smirnov test.',''],
 ['Statistics','Shapiro-Wilk test','A test of normality. If p > 0.05, the data can be treated as normally distributed.',''],
 ['Statistics','Levene\'s test','A test of whether groups have equal variances, an assumption of the t-test and ANOVA. If p > 0.05, variances are treated as equal.',''],
 ['Statistics','Post hoc test','A follow-up test after a significant ANOVA that shows which groups differ, such as Tukey HSD.',''],
 ['Statistics','Correlation coefficient','A number from −1 to +1 showing the strength and direction of a relationship.',''],
 ['Statistics','Degrees of freedom (df)','The number of values free to vary when computing a statistic. Reported with t, F and chi-square results.',''],
 ['Ethics','Informed consent','A participant\'s voluntary agreement to join after understanding the study\'s purpose, procedures, risks and benefits.',''],
 ['Ethics','Ethics review board','A committee (IRB or REC) that reviews studies to protect participants before data collection starts.',''],
 ['Ethics','Confidentiality','Keeping participants\' information private and using it only for the study.',''],
 ['Ethics','Anonymity','Not even the researcher can link responses to a specific participant.',''],
 ['Ethics','Beneficence','The duty to do good and avoid harm to participants.',''],
 ['Ethics','Respect for persons','Treating participants as autonomous, including the right to refuse or withdraw at any time.',''],
 ['Ethics','Justice','Fair selection and treatment of participants.',''],
 ['Ethics','Data Privacy Act','Laws that govern how personal data are collected, stored and used. Follow the law that applies where you do your study.','']
];
let termCat='',termQ='';
function renderTerms(){
  $('#app').innerHTML=`<section class="hero"><span class="label">Glossary</span><h1>Definition of terms</h1><p>${TERMS.length} terms used in quantitative nursing research, from pilot study and Cronbach's alpha to p-value and informed consent.</p></section>
  <div class="box" style="gap:10px"><label class="label" for="tq">Search terms</label><input id="tq" class="gsearch" type="text" placeholder="Try Cronbach, pilot or sampling" value="${esc(termQ)}" style="max-width:none">
  <div class="row" id="tcats"></div></div>
  <p class="hint" id="tcount" style="margin-top:14px"></p><dl class="gloss" id="tl" style="margin-top:10px"></dl>`;
  const cats=$('#tcats');
  const drawCats=()=>{cats.innerHTML='';['',...TERM_CATS].forEach(c=>{const b=el(`<button class="ghost" aria-pressed="${termCat===c}">${c||'All'}</button>`);b.onclick=()=>{termCat=c;drawCats();draw()};cats.append(b)})};
  const draw=()=>{const q=termQ.trim().toLowerCase();
    const list=TERMS.filter(([c,t,d,x])=>(!termCat||c===termCat)&&(!q||(t+' '+d+' '+x).toLowerCase().includes(q))).sort((a,b)=>a[1].localeCompare(b[1]));
    $('#tcount').textContent=`${list.length} of ${TERMS.length} terms`;
    $('#tl').innerHTML=list.map(([c,t,d,x])=>`<div><span class="label">${esc(c)}</span><dt style="margin-top:4px">${esc(t)}</dt><dd>${esc(d)}${x?`<br><i>Example: ${esc(x)}</i>`:''}</dd></div>`).join('')||'<p class="hint">No terms match. Try a shorter word or choose All.</p>'};
  $('#tq').oninput=e=>{termQ=e.target.value;draw()};
  drawCats();draw();
}

// ---------- Sampling advice for the test finder ----------
const SAMPLING={
  descriptive:{tech:'Probability sampling: simple random or stratified random',must:'',
    pts:['Simple random sampling gives every member of the population an equal chance, so results can be generalized.','Use stratified random sampling when the population has subgroups (wards, year levels) that should all be represented.','Convenience or purposive sampling is common in student studies, but state it as a limitation because results may not generalize.'],size:'sample'},
  correlational:{tech:'Probability sampling: simple random or stratified random',must:'',
    pts:['Random sampling gives the full range of scores in the population, which correlations need.','A narrow, convenience sample (for example, only top students) can hide a real relationship.','Purposive sampling with clear inclusion criteria is acceptable if you state it as a limitation.'],size:'power'},
  comparative:{tech:'Stratified random sampling, one stratum per group',must:'',
    pts:['Treat each group you compare (for example, day, evening and night shift) as a stratum and sample randomly from each.','Aim for similar group sizes; unequal groups reduce power and can affect equal-variance assumptions.','Groups already exist, so no one is assigned. The design stays non-experimental.'],size:'power'},
  quasi:{tech:'Convenience or purposive sampling of intact groups',must:'',
    pts:['Quasi-experiments usually use existing groups, such as whole wards, sections or one group measured before and after.','There is no random assignment, so check that groups are similar at pretest (age, baseline scores) and report it.','If you can, randomly choose which intact group gets the intervention. This strengthens the design but it is still quasi-experimental.'],size:'power'},
  true:{tech:'Random assignment to groups (randomization)',must:'Random assignment is required',
    pts:['What makes a study a true experiment or RCT is <b>random assignment</b>: chance decides whether each participant goes to the intervention or control group (simple, block or stratified randomization).','<b>Random sampling</b> (randomly choosing who is in the study) is a different step. It is preferred, but many RCTs recruit eligible patients consecutively or by convenience and then randomize them.','Keep the allocation hidden until assignment (allocation concealment), and blind participants or outcome assessors when possible.'],size:'power'},
  predictive:{tech:'Probability sampling: simple random or stratified random',must:'',
    pts:['Random sampling lets the prediction model apply to the whole population.','Include enough respondents for the number of predictors; use the G*Power calculator for multiple regression.','Convenience samples are common but limit how far the model can be generalized.'],size:'power'}
};
function samplingBox(){
  const s=SAMPLING[F.type];if(!s)return null;
  return el(`<div class="box"><span class="label">Sampling for this type of research</span>${s.must?`<span class="badge">${s.must}</span>`:''}<h3>${s.tech}</h3><ul>${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>
    <p class="hint">Sample size: ${s.size==='sample'?'use the <a href="#sample">Slovin calculator</a> for a known population.':'use the <a href="#power">G*Power calculator</a> for your test, or Slovin if your adviser requires it.'}</p></div>`);
}

// ---------- Descriptive statistics tool ----------
const DKEY='evidence-rounds-desc-v1';
const DSAMPLE='72 85 90 68 77 85 93 61 88 79 85 74 82 70 95 66 80 85 77 91 73 84 69 87 78';
let D={raw:DSAMPLE,kind:'sample',label:'Knowledge scores'};
try{Object.assign(D,JSON.parse(localStorage.getItem(DKEY))||{})}catch(e){}
if(!Array.isArray(D.vals))D.vals=String(D.raw||'').split(/[\s,;]+/).filter(Boolean);
function dsave(){try{localStorage.setItem(DKEY,JSON.stringify(D))}catch(e){}}
function parseNums(raw){const bad=[],xs=[];raw.split(/[\s,;]+/).filter(Boolean).forEach(t=>{const v=Number(t);if(isFinite(v))xs.push(v);else bad.push(t)});return{xs,bad}}
function dstats(xs,kind){
  const n=xs.length,s=[...xs].sort((a,b)=>a-b),sum=xs.reduce((a,b)=>a+b,0),mean=sum/n;
  const median=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
  const cnt=new Map();xs.forEach(x=>cnt.set(x,(cnt.get(x)||0)+1));const maxc=Math.max(...cnt.values());
  const modes=maxc>1?[...cnt.entries()].filter(([,c])=>c===maxc).map(([v])=>v).sort((a,b)=>a-b):[];
  const ss=xs.reduce((a,x)=>a+(x-mean)**2,0),den=kind==='sample'?n-1:n,variance=den>0?ss/den:NaN,sd=Math.sqrt(variance);
  let skew=NaN;if(n>=3&&ss>0){const m2=ss/n,m3=xs.reduce((a,x)=>a+(x-mean)**3,0)/n;const g1=m3/Math.pow(m2,1.5);skew=Math.sqrt(n*(n-1))/(n-2)*g1}
  return{n,s,sum,mean,median,modes,maxc,ss,variance,sd,min:s[0],max:s[n-1],skew};
}
const f2=(x,d=2)=>isFinite(x)?Number(x.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d}):'–';
function histogram(xs,st){
  const allInt=xs.every(Number.isInteger),range=st.max-st.min;let bins=[];
  if(range===0)bins=[{lo:st.min,hi:st.min,c:xs.length,lab:String(st.min)}];
  else if(allInt&&range<=15){for(let v=st.min;v<=st.max;v++)bins.push({lo:v,hi:v,c:0,lab:String(v)});xs.forEach(x=>bins[x-st.min].c++)}
  else{const k=Math.ceil(Math.log2(xs.length))+1,w0=range/k,w=allInt?Math.ceil(w0):w0;
    for(let i=0;i<k;i++){const lo=st.min+i*w,hi=lo+w;bins.push({lo,hi,c:0,lab:allInt?`${lo}–${hi-1}`:`${f2(lo)}–${f2(hi)}`})}
    xs.forEach(x=>{let i=Math.floor((x-st.min)/w);if(i>=bins.length)i=bins.length-1;bins[i].c++});
    while(bins.length>1&&bins[bins.length-1].c===0)bins.pop()}
  const W=640,Hh=300,L=44,R=12,T=16,B=58,pw=W-L-R,ph=Hh-T-B,maxC=Math.max(...bins.map(b=>b.c)),yTop=Math.max(1,Math.ceil(maxC*1.15));
  const bw=pw/bins.length,y=c=>T+ph-(c/yTop)*ph;
  const step=yTop<=6?1:Math.ceil(yTop/5);let grid='';for(let v=0;v<=yTop;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const discrete=bins[0].lo===bins[0].hi;
  const xpos=v=>{if(discrete)return L+(v-st.min+0.5)*bw;const lo=bins[0].lo,hi=bins[bins.length-1].hi;return L+((v-lo)/(hi-lo))*pw};
  const bars=bins.map((b,i)=>`<rect x="${L+i*bw+2}" y="${y(b.c)}" width="${Math.max(1,bw-4)}" height="${T+ph-y(b.c)}" rx="2" fill="var(--accent)" opacity=".85"><title>${b.lab}: ${b.c}</title></rect>${b.c?`<text x="${L+i*bw+bw/2}" y="${y(b.c)-5}" text-anchor="middle" font-size="11" fill="var(--ink)">${b.c}</text>`:''}<text x="${L+i*bw+bw/2}" y="${T+ph+16}" text-anchor="middle" font-size="${bins.length>10?9:11}" fill="var(--muted)">${b.lab}</text>`).join('');
  const mx=xpos(st.mean),mdx=xpos(st.median);
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Histogram of ${xs.length} values">${grid}${bars}
   <line x1="${mx}" x2="${mx}" y1="${T}" y2="${T+ph}" stroke="var(--mark)" stroke-width="2" stroke-dasharray="6 4"/>
   <line x1="${mdx}" x2="${mdx}" y1="${T}" y2="${T+ph}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 3"/>
   <text x="${L+pw/2}" y="${Hh-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(D.label||'Score')}${discrete?'':' (class intervals)'}</text>
   <text x="12" y="${T+ph/2}" text-anchor="middle" font-size="12" fill="var(--muted)" transform="rotate(-90 12 ${T+ph/2})">Frequency</text></svg>
   <div class="row hint" style="gap:16px"><span><span style="display:inline-block;width:18px;border-top:2px dashed var(--mark);vertical-align:middle"></span> Mean ${f2(st.mean)}</span><span><span style="display:inline-block;width:18px;border-top:2px dotted var(--ink);vertical-align:middle"></span> Median ${f2(st.median)}</span></div>`;
}
function renderDesc(){
  $('#app').innerHTML=toolsBar('stats')+`<section class="hero"><span class="label">Tools · Descriptive statistics</span><h1>Mean, median, mode and standard deviation</h1><p>Enter your scores in the table. The calculator works out the measures of central tendency and variability, shows the computation, and draws a histogram so you can see the shape of your data.</p></section>
  <div class="layout"><div class="work"><div class="box"><span class="label">Your data</span>
    <div class="field"><label for="d-label">What was measured?</label><input type="text" id="d-label" value="${esc(D.label)}" placeholder="e.g. Pain score"></div>
    <div class="field"><span style="font-weight:600">Data table</span><p class="hint">Type one score per row. Press Enter to go to the next row. You can also paste a whole column from Excel or Google Sheets into any cell.</p>
      <div class="dtable" id="d-tbl"></div>
      <div class="row"><button class="ghost" id="d-add">+ Add row</button><button class="ghost" id="d-add10">+ Add 10 rows</button></div></div>
    <div class="row"><span class="hint">Standard deviation for a</span><button class="ghost" data-k="sample" aria-pressed="${D.kind==='sample'}">Sample (n − 1)</button><button class="ghost" data-k="population" aria-pressed="${D.kind==='population'}">Population (N)</button></div>
    <div class="row"><button class="ghost" id="d-ex">Load example data</button><button class="ghost" id="d-clr">Clear</button><span class="hint" id="d-note"></span></div></div>
    <div id="d-out" class="work"></div></div>
  <aside class="guide"><div class="box soft"><h3>Which measure should I report?</h3><ul><li><b>Interval or ratio, roughly symmetric:</b> mean and standard deviation.</li><li><b>Skewed data or outliers:</b> median, because extreme values pull the mean.</li><li><b>Ordinal data:</b> median and mode, or weighted mean for Likert scales.</li><li><b>Nominal data:</b> mode, with frequency and percentage.</li></ul></div>
  <div class="box"><h3>Reading the histogram</h3><p>A bell shape with mean and median close together suggests normal data, so parametric tests may fit. A long tail on one side means skewed data. Confirm normality with the Shapiro-Wilk test in your statistics software.</p></div>
  <div class="box"><h3>Sample or population SD?</h3><p>Use the <b>sample</b> SD (divide by n − 1) when your respondents are a sample of a larger population, which is almost always the case in research. Use the <b>population</b> SD (divide by N) only when you measured everyone.</p></div></aside></div>`;
  const out=$('#d-out');
  const tbl=$('#d-tbl');
  const drawTable=(focusI)=>{
    const rows=Math.max(D.vals.length+1,10);
    tbl.innerHTML=`<table><thead><tr><th style="width:64px">No.</th><th>${esc(D.label||'Score')}</th><th style="width:48px"><span class="sr">Remove</span></th></tr></thead><tbody>${Array.from({length:rows},(_,i)=>{const v=D.vals[i]??'',bad=v.trim()!==''&&!isFinite(Number(v));return `<tr${bad?' class="badrow"':''}><td class="rn">${i+1}</td><td><input type="text" inputmode="decimal" autocomplete="off" data-i="${i}" value="${esc(v)}" aria-label="Row ${i+1} ${esc(D.label||'score')}"></td><td><button class="del" data-del="${i}" aria-label="Remove row ${i+1}" title="Remove row">✕</button></td></tr>`}).join('')}</tbody></table>`;
    if(focusI!=null){const f=tbl.querySelector(`[data-i="${focusI}"]`);if(f){f.focus();f.select()}}
  };
  const trim=()=>{while(D.vals.length&&String(D.vals[D.vals.length-1]).trim()==='')D.vals.pop()};
  tbl.addEventListener('input',e=>{const i=e.target.dataset.i;if(i==null)return;const k=+i;while(D.vals.length<k)D.vals.push('');D.vals[k]=e.target.value;e.target.closest('tr').classList.toggle('badrow',e.target.value.trim()!==''&&!isFinite(Number(e.target.value)));trim();dsave();calc();
    const rows=tbl.querySelectorAll('tbody tr').length;if(k>=rows-1){drawTable(k)}});
  tbl.addEventListener('keydown',e=>{const i=e.target.dataset.i;if(i==null)return;const k=+i;
    if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();const n=tbl.querySelector(`[data-i="${k+1}"]`);if(n){n.focus();n.select()}else drawTable(k+1)}
    else if(e.key==='ArrowUp'&&k>0){e.preventDefault();const n=tbl.querySelector(`[data-i="${k-1}"]`);n.focus();n.select()}});
  tbl.addEventListener('paste',e=>{const i=e.target.dataset.i;if(i==null)return;const txt=(e.clipboardData||window.clipboardData).getData('text');const parts=txt.split(/[\s,;]+/).filter(Boolean);if(parts.length<2)return;
    e.preventDefault();const k=+i;while(D.vals.length<k)D.vals.push('');D.vals.splice(k,parts.length,...parts);trim();dsave();drawTable(k+parts.length);calc()});
  tbl.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(!d)return;const k=+d.dataset.del;if(k<D.vals.length)D.vals.splice(k,1);trim();dsave();drawTable();calc()});
  $('#d-add').onclick=()=>{drawTable(Math.max(D.vals.length,0))};
  $('#d-add10').onclick=()=>{const n=tbl.querySelectorAll('tbody tr').length;tbl.querySelector('tbody').insertAdjacentHTML('beforeend',Array.from({length:10},(_,j)=>{const i=n+j;return `<tr><td class="rn">${i+1}</td><td><input type="text" inputmode="decimal" autocomplete="off" data-i="${i}" aria-label="Row ${i+1}"></td><td><button class="del" data-del="${i}" aria-label="Remove row ${i+1}" title="Remove row">✕</button></td></tr>`}).join(''))};
  const calc=()=>{
    const {xs,bad}=parseNums(D.vals.join(' '));
    const badRows=D.vals.map((v,i)=>v.trim()!==''&&!isFinite(Number(v))?i+1:0).filter(Boolean);
    $('#d-note').textContent=badRows.length?`Skipped ${badRows.length} cell${badRows.length>1?'s':''} that ${badRows.length>1?'are':'is'} not a number (row ${badRows.slice(0,5).join(', ')}${badRows.length>5?'…':''}).`:'';
    if(xs.length<2){out.innerHTML=`<p class="note">Enter at least two numbers to compute the statistics.</p>`;return}
    if(xs.length>5000){out.innerHTML=`<p class="note bad">Please enter 5,000 values or fewer.</p>`;return}
    const st=dstats(xs,D.kind),nm=D.kind==='sample'?'n − 1':'N',sym=D.kind==='sample'?'s':'σ';
    const sk=st.skew,skTxt=!isFinite(sk)?'':Math.abs(sk)<0.5?'approximately symmetric':sk>0?(sk<1?'moderately positively skewed (tail to the right)':'highly positively skewed (tail to the right)'):(sk>-1?'moderately negatively skewed (tail to the left)':'highly negatively skewed (tail to the left)');
    const tiles=[['n',st.n.toLocaleString('en-US')],['Mean',f2(st.mean)],['Median',f2(st.median)],['Mode',st.modes.length?st.modes.map(m=>f2(m)).join(', '):'None'],[`SD (${sym})`,f2(st.sd)],['Variance',f2(st.variance)],['Minimum',f2(st.min)],['Maximum',f2(st.max)],['Range',f2(st.max-st.min)]];
    const sortedTxt=st.s.length<=60?st.s.join(', '):st.s.slice(0,60).join(', ')+' …';
    const mid=st.n%2?`the middle value, position ${(st.n+1)/2}`:`the average of positions ${st.n/2} and ${st.n/2+1}: (${st.s[st.n/2-1]} + ${st.s[st.n/2]}) / 2`;
    out.innerHTML=`<div class="box"><span class="label">Results</span><div class="tiles">${tiles.map(([a,b])=>`<div><span class="label">${a}</span><b>${b}</b></div>`).join('')}</div>
      ${isFinite(sk)?`<p>Skewness = ${f2(sk)}: the data are <b>${skTxt}</b>.${Math.abs(sk)>=0.5?' Consider reporting the median, and check normality before choosing a parametric test.':''}</p>`:''}
      <p class="hint">Report as: ${esc(D.label||'Scores')} had a mean of ${f2(st.mean)} (SD = ${f2(st.sd)}), a median of ${f2(st.median)}, and ranged from ${f2(st.min)} to ${f2(st.max)}.</p></div>
      <div class="box"><span class="label">Histogram</span>${histogram(xs,st)}</div>
      <details class="box"><summary>Show the computation</summary><div class="work-out" style="white-space:pre-wrap">Sorted: ${sortedTxt}

Mean      x̄ = Σx / n = ${f2(st.sum,4)} / ${st.n} = ${f2(st.mean,4)}
Median    = ${mid} = ${f2(st.median,4)}
Mode      = ${st.modes.length?`${st.modes.join(', ')} (appears ${st.maxc} times)`:'no value repeats, so there is no mode'}
Σ(x − x̄)² = ${f2(st.ss,4)}
Variance  ${sym}² = Σ(x − x̄)² / (${nm}) = ${f2(st.ss,4)} / ${D.kind==='sample'?st.n-1:st.n} = ${f2(st.variance,4)}
SD        ${sym} = √${f2(st.variance,4)} = ${f2(st.sd,4)}</div></details>`;
  };
  $('#d-label').oninput=e=>{D.label=e.target.value;dsave();calc();const th=tbl.querySelector('thead th:nth-child(2)');if(th)th.textContent=D.label||'Score'};
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{D.kind=b.dataset.k;dsave();document.querySelectorAll('[data-k]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===D.kind));calc()});
  $('#d-ex').onclick=()=>{D.vals=DSAMPLE.split(' ');D.label='Knowledge scores';dsave();$('#d-label').value=D.label;drawTable();calc()};
  $('#d-clr').onclick=()=>{D.vals=[];dsave();drawTable(0);calc()};
  drawTable();calc();
}

// ---------- Router ----------
function route(){
  let v=(location.hash||'#start').slice(1);
  if(v==='newtest'){F={type:'',iv:'',dv:'',groups:'',normal:''};fsave();try{history.replaceState(null,'','#home')}catch(e){}v='home'}
  const view=v==='tools'?'sample':['start','build','builder','tests','sample','power','examples','hypothesis','terms','stats'].includes(v)?v:'home';
  if(view==='build'&&!S)S=blank();
  renderTop(view);
  if(view==='start')renderStart();else if(view==='build')renderBuild();else if(view==='builder')renderHome();else if(view==='tests')renderTests();else if(view==='sample')renderSample();else if(view==='power')renderPower();else if(view==='examples')renderExamples();else if(view==='hypothesis')renderHyp();else if(view==='terms')renderTerms();else if(view==='stats')renderDesc();else renderFinder();
  window.scrollTo({top:0});
}
window.addEventListener('hashchange',route);
route();
</script>
