<style>
/* Layout: top bar, a six-step stepper, then a working form column with a guide column beside it (stacked on phones). */
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --ink:#132A33; --muted:#52707A; --line:#D3E0E1;
  --accent:#0B6E6E; --accent-ink:#FFFFFF; --accent-soft:#DCEDEB; --mark:#B4600E; --mark-soft:#F8EADB;
  --good:#1D7A3A; --good-soft:#E1F2E5; --bad:#B3261E; --bad-soft:#F8E1DF;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1618; --surface:#132226; --ink:#E2EEEE; --muted:#8EA9AD; --line:#24393D;
  --accent:#4FC1BB; --accent-ink:#06201F; --accent-soft:#163633; --mark:#EBA35C; --mark-soft:#3A2A19;
  --good:#62C882; --good-soft:#163222; --bad:#F2857C; --bad-soft:#3A1C1A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1618; --surface:#132226; --ink:#E2EEEE; --muted:#8EA9AD; --line:#24393D;
  --accent:#4FC1BB; --accent-ink:#06201F; --accent-soft:#163633; --mark:#EBA35C; --mark-soft:#3A2A19;
  --good:#62C882; --good-soft:#163222; --bad:#F2857C; --bad-soft:#3A1C1A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.7rem)} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:.88rem;color:var(--muted)}

.wrap{max-width:1140px;margin:0 auto;padding-inline:24px;padding-block:0 64px}
.top{display:flex;align-items:center;justify-content:flex-start;gap:14px;padding-block:18px;flex-wrap:nowrap}
.brand{min-width:0}.brand b{white-space:nowrap}
@media (max-width:440px){.menucur{display:none}.brand b{font-size:1.1rem!important}}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:600}
.foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:4px}.foot p{margin:0}.foot b{color:var(--ink)}
.pbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.pbar span{height:8px;border-radius:4px;background:var(--line)}.pbar span.on{background:var(--good)}.pbar span.cur:not(.on){background:var(--accent);opacity:.55}
.prog{gap:10px}
.writeup{font-size:.98rem;line-height:1.65}.writeup p{margin:0 0 10px}.writeup .ph{background:var(--mark-soft);border-radius:4px;padding:0 3px;font-weight:600}
.shero h1{max-width:20ch;font-size:clamp(2rem,4.6vw,3.2rem)}
.lede{font-size:1.1rem;max-width:62ch;margin:0}
.sstats{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sstats li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sstats b{font-family:var(--display);font-size:1.9rem;color:var(--accent);line-height:1.1}.sstats span{color:var(--muted);font-size:.9rem;line-height:1.35}
.hows{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;counter-reset:none}
.hows li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.hows .hn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.hows p{margin:4px 0 0;color:var(--muted);font-size:.95rem;line-height:1.5}
.shead{display:flex;align-items:center;gap:10px}.sico{flex:none;color:var(--accent)}
.sgroup{font-family:var(--body);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.who p{margin:6px 0 0}
.sugg{font-size:.92rem;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--ink)}.sugg:empty{display:none}.sugg .ghost{padding:5px 10px;font-size:.88rem}.sugg-ok{color:var(--good);font-weight:600}
.restart{display:flex;justify-content:flex-end;margin-top:4px}
.menu{position:relative}
.menubtn{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px}
.menubtn[aria-expanded="true"]{border-color:var(--accent)}

// ---------- Slovin's formula ----------
function slovin(Nraw,eraw){

function slovinWidget(state,onChange){

  <p class="hint">Enter how many people are in your population. The calculator tells you the minimum number of respondents to sample.</p>
  <div class="calc"><div class="field"><label for="sv-N">Population size (N)</label><input type="number" id="sv-N" min="1" step="1" inputmode="numeric" value="${esc(state.N)}" placeholder="e.g. 450"></div>
  <div class="field"><label for="sv-e">Margin of error (e)</label><select id="sv-e">${[['0.01','1% (0.01)'],['0.02','2% (0.02)'],['0.03','3% (0.03)'],['0.05','5% (0.05), most common'],['0.10','10% (0.10)']].map(([v,l])=>`<option value="${v}" ${state.e===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
  <div id="sv-out"></div></div>`);
  const out=w.querySelector('#sv-out');
  const draw=()=>{const r=slovin(state.N,state.e);
    if(!r){out.innerHTML=`<div class="work-out">n = N / (1 + N × e²)</div><p class="hint" style="margin-top:8px">${state.N?'Enter a whole number of 1 or more.':'Example: a population of 450 students at e = 0.05 needs 212 respondents.'}</p>`;return}
    out.innerHTML=`<div class="calc-out"><span class="n">${r.n.toLocaleString('en-US')}</span><span>respondents needed</span></div>
    <div class="work-out" style="margin-top:10px">n = N / (1 + N × e²)
n = ${r.N.toLocaleString('en-US')} / (1 + ${r.N.toLocaleString('en-US')} × ${r.e}²)
n = ${r.N.toLocaleString('en-US')} / (1 + ${fmt(r.N*r.e*r.e,4)})
n = ${r.N.toLocaleString('en-US')} / ${fmt(r.denom,4)}
n = ${fmt(r.raw,2)}  →  round up to ${r.n.toLocaleString('en-US')}</div>
    <p class="hint" style="margin-top:8px">Always round up, since you cannot sample part of a person. Many researchers add 10% to allow for dropouts or incomplete answers (${Math.ceil(r.n*1.1).toLocaleString('en-US')} here).</p>`};
  w.querySelector('#sv-N').oninput=e=>{state.N=e.target.value;draw();onChange&&onChange()};
  w.querySelector('#sv-e').onchange=e=>{state.e=e.target.value;draw();onChange&&onChange()};
  draw();return w;
}
function slovinGuide(){
  return `<div class="box"><h3>About Slovin's formula</h3><p>Slovin's formula gives a minimum sample size from a known, finite population when you do not know how varied it is. It is common in descriptive and correlational nursing studies.</p><ul><li><b>N</b> is the total population, such as all 450 second-year students.</li><li><b>e</b> is the margin of error you accept. 0.05 means 95% confidence.</li><li>A smaller e gives a larger sample.</li></ul><p class="hint">For experiments, many advisers prefer a power analysis (try the <a href="#power">G*Power calculator</a>) because it accounts for the expected effect size. Use what your program requires.</p></div>`;
}

// ---------- Logic: design ----------
function design(){
  const iv=ivs()[0]?.name||ph('independent variable');
  const g=S.goal;
  if(g==='describe')return{type:'Non-experimental',name:'Descriptive survey design',why:`You will measure and describe ${lc(join(named().filter(v=>v.role!=='Demo').map(v=>v.name)))||'your variables'} as they are, without giving an intervention or testing relationships.`,time:true};
  if(g==='relate')return{type:'Non-experimental',name:'Descriptive correlational design',why:`You will measure ${lc(iv)} and ${lc(dvs()[0]?.name||ph('dependent variable'))} in the same respondents and test whether they move together. Nothing is manipulated, so you can show a relationship but not cause and effect.`,time:true};
  if(g==='predict')return{type:'Non-experimental',name:'Predictive correlational design',why:`You will test which of ${lc(join(ivs().map(v=>v.name)))||'your predictors'} predict ${lc(dvs()[0]?.name||ph('dependent variable'))}, without manipulating anything.`,time:true};
  if(g==='compare')return{type:'Non-experimental',name:'Comparative (causal-comparative) design',why:`The groups already exist (${lc(iv)}), so you compare them without giving an intervention.`,time:true};
  if(g==='effect'){
    if(S.assign==='random'){
      if(S.groups==='mixed')return{type:'True experimental',name:'Randomized controlled design with repeated measures',why:`You use chance to place participants into the ${lc(iv)} or control group and measure both groups three or more times.`,nota:'R   O₁   X   O₂   O₃\nR   O₁       O₂   O₃'};
      if(S.groups==='3i')return{type:'True experimental',name:'Randomized multiple-group pretest-posttest design',why:`You give ${lc(iv)} and use chance to place participants into three or more groups, so the groups start out comparable.`,nota:'R   O₁   X₁   O₂\nR   O₁   X₂   O₂\nR   O₁        O₂'};
      return{type:'True experimental',name:'Pretest-posttest control group design',why:`You give ${lc(iv)} to one group, use chance to decide who is in the intervention or control group, and measure both groups before and after.`,nota:'R   O₁   X   O₂\nR   O₁       O₂'};
    }
    if(S.groups==='2p')return{type:'Quasi-experimental',name:'One-group pretest-posttest design',why:`You give ${lc(iv)} to one group and measure them before and after. There is no control group, so note history and maturation as threats to validity.`,nota:'O₁   X   O₂'};
    if(S.groups==='3p')return{type:'Quasi-experimental',name:'Interrupted time-series design',why:`You measure one group several times before and after ${lc(iv)} to see whether the trend changes.`,nota:'O₁   O₂   O₃   X   O₄   O₅   O₆'};
    if(S.groups==='mixed')return{type:'Quasi-experimental',name:'Nonequivalent control group design with repeated measures',why:`One existing group receives ${lc(iv)} and another does not, and both are measured three or more times.`,nota:'O₁   X   O₂   O₃\n- - - - - - - - - -\nO₁       O₂   O₃'};
    if(S.groups==='3i')return{type:'Quasi-experimental',name:'Nonequivalent multiple-group design',why:`You compare three or more existing groups, at least one receiving ${lc(iv)}, without random assignment.`,nota:'O₁   X₁   O₂\n- - - - - - - -\nO₁   X₂   O₂\n- - - - - - - -\nO₁        O₂'};
    return{type:'Quasi-experimental',name:'Nonequivalent control group pretest-posttest design',why:`One existing group receives ${lc(iv)} and another does not. Groups are not randomly formed, so compare their pretest scores to check they started out similar.`,nota:'O₁   X   O₂\n- - - - - - -\nO₁       O₂'};
  }
  return null;
}

// ---------- Logic: statistical test ----------
const P=(name,why)=>({kind:'p',name,why});
const NP=(name,why)=>({kind:'np',name,why});
const OT=(name,why)=>({kind:'o',name,why});
const COMPARE={
  '2i':{p:'Independent samples t-test',np:'Mann-Whitney U test',c:'Chi-square test of independence',d:'two independent groups'},
  '2p':{p:'Paired samples t-test',np:'Wilcoxon signed-rank test',c:'McNemar test',d:'the same group measured twice'},
  '3i':{p:'One-way ANOVA',np:'Kruskal-Wallis H test',c:'Chi-square test of independence',d:'three or more independent groups'},
  '3p':{p:'Repeated-measures ANOVA',np:'Friedman test',c:'Cochran\'s Q test',d:'the same group measured three or more times'},
  'ancova':{p:'ANCOVA (analysis of covariance)',np:'Quade test (rank ANCOVA)',c:'Binary logistic regression',d:'groups compared on the posttest while adjusting for their pretest scores'},
  'mixed':{p:'Mixed (split-plot) ANOVA',np:'Friedman (within each group) + Mann-Whitney U or Kruskal-Wallis (between groups)',c:'Generalized estimating equations (GEE)',d:'two or more groups each measured three or more times'},
  'two':{p:'Two-way ANOVA',np:'Mann-Whitney U or Kruskal-Wallis for each factor',c:'Binary logistic regression',d:'groups formed by two independent variables at once'}
};
function needsNormality(){
  const dv=dvs()[0],iv=ivs()[0];if(!dv)return false;
  if(S.goal==='relate')return!!(iv&&isNum(iv.level)&&isNum(dv.level));
  return (S.goal==='compare'||S.goal==='effect')&&isNum(dv.level);
}
function chooseTest(){
  const g=S.goal,dv=dvs()[0],iv=ivs()[0];
  if(!g)return{issue:'Choose what your research question asks in Step 3.'};
  if(g==='describe')return OT('Descriptive statistics','Your question only describes, so no hypothesis test is needed. Use the descriptive tool that fits each variable\'s level of measurement (table below).');
  if(!dv)return{issue:'Add a dependent variable in Step 2.'};
  if(!dv.level)return{issue:`Set the level of measurement of ${dv.name} in Step 2.`};
  if(g==='predict'){
    if(!ivs().length)return{issue:'Add at least one independent variable (predictor) in Step 2.'};
    if(isNum(dv.level)&&(S.npred?S.npred==='1':ivs().length===1))return P('Simple linear regression',`${dv.name} is ${dv.level.toLowerCase()} data and there is one predictor, so simple linear regression shows how much ${dv.name.toLowerCase()==='the dependent variable'?'the outcome':lc(dv.name)} changes for each unit of the predictor. It assumes the residuals are roughly normal.`);
    if(isNum(dv.level))return P('Multiple linear regression',`${dv.name} is ${dv.level.toLowerCase()} data, so a linear regression can show how much each predictor adds. It assumes the residuals are roughly normal.`);
    if(dv.level==='Nominal')return OT('Binary logistic regression',`${dv.name} is a yes/no (nominal) outcome, so logistic regression predicts the odds of it happening. It does not assume normal data.`);
    return OT('Ordinal logistic regression',`${dv.name} is ordinal, so ordinal logistic regression predicts the odds of being in a higher category.`);
  }
  if(g==='relate'){
    if(!iv)return{issue:'Add an independent variable in Step 2.'};
    if(!iv.level)return{issue:`Set the level of measurement of ${iv.name} in Step 2.`};
    const a=iv.level,b=dv.level;
    if(a==='Nominal'&&b==='Nominal')return NP('Chi-square test of independence','Both variables are nominal (categories), so you test whether they are associated by comparing observed and expected counts.');
    if((a==='Nominal'&&b==='Ordinal')||(a==='Ordinal'&&b==='Nominal'))return NP('Chi-square test of independence','One variable is nominal and the other ordinal, so you cross-tabulate the categories and test for association.');
    if(a==='Nominal'||b==='Nominal')return{issue:`${a==='Nominal'?iv.name:dv.name} is a category and the other variable is a score. Comparing scores across categories is a comparison between groups, so go back to Step 3 and choose "Compare existing groups".`};
    if(a==='Ordinal'||b==='Ordinal')return NP('Spearman rank-order correlation (rho)','At least one variable is ordinal, so the data are ranked and a non-parametric correlation is used.');
    const pr=P('Pearson product-moment correlation (r)','Both variables are interval or ratio and normally distributed, so a parametric correlation fits.'),
          sp=NP('Spearman rank-order correlation (rho)','Both variables are numeric but not normally distributed, so the data are ranked and a non-parametric correlation is used.');
    if(S.normal==='yes')return{...pr,alt:sp};
    if(S.normal==='no')return sp;
    return{both:[pr,sp]};
  }
  if(g==='compare'||g==='effect'){
    if(!S.groups)return{issue:'Choose how your groups are arranged in Step 3.'};
    if(g==='effect'&&!S.assign)return{issue:'Say whether participants are randomly assigned in Step 3.'};
    const c=COMPARE[S.groups];
    if(dv.level==='Nominal')return(/regression|GEE/.test(c.c)?OT:NP)(c.c,`${dv.name} is nominal (counts in categories) and you have ${c.d}, so you compare proportions instead of means.`);
    if(dv.level==='Ordinal')return NP(c.np,`${dv.name} is ordinal, so you compare ranks instead of means. You have ${c.d}.`);
    const pr=P(c.p,`${dv.name} is ${dv.level.toLowerCase()} and normally distributed, and you have ${c.d}, so you compare means with a parametric test.${S.groups==='3i'||S.groups==='3p'?' If the result is significant, run a post hoc test (such as Tukey HSD or Bonferroni) to see which groups differ.':''}`),
          np=NP(c.np,`${dv.name} is numeric but not normally distributed, and you have ${c.d}, so you compare ranks with a non-parametric test.${S.groups==='two'||S.groups==='mixed'?' There is no common non-parametric test for the interaction, so test each effect separately and say so in your limitations.':''}`);
    if(S.normal==='yes')return{...pr,alt:np};
    if(S.normal==='no')return np;
    return{both:[pr,np]};
  }
}
function descTool(v){
  if(v.level==='Nominal')return'Frequency and percentage';
  if(v.level==='Ordinal')return'Frequency, percentage and median (weighted mean for Likert scales)';
  if(isNum(v.level))return'Mean and standard deviation';
  return'Set the level of measurement';
}

// ---------- Logic: wording ----------
function words(){
  const p=S.problem,pop=p.population.trim()||ph('population'),set=p.setting.trim()?` in ${p.setting.trim()}`:'';
  const iv=ivs()[0]?.name||ph('independent variable'),dv=dvs()[0]?.name||ph('dependent variable');
  const ivList=join(ivs().map((v,i)=>i?lc(v.name):v.name))||iv,main=named().filter(v=>v.role!=='Demo').map((v,i)=>i?lc(v.name):v.name);
  const g=S.goal;let title='',purpose='',rq='',h0='';
  if(g==='describe'){title=`${cap(join(main)||p.topic||ph('variables'))} of ${pop}${set}`;purpose=`describe the ${lc(join(main)||ph('variables'))} of ${pop}${set}`}
  else if(g==='relate'){title=`${cap(iv)} and ${lc(dv)} of ${pop}${set}`;purpose=`determine the relationship between ${lc(iv)} and ${lc(dv)} among ${pop}${set}`;rq=`Is there a significant relationship between ${lc(iv)} and ${lc(dv)}?`;h0=`There is no significant relationship between ${lc(iv)} and ${lc(dv)} of the respondents.`}
  else if(g==='predict'){title=`${cap(ivList)} as predictors of ${lc(dv)} among ${pop}${set}`;purpose=`determine whether ${lc(ivList)} significantly predict ${lc(dv)} among ${pop}${set}`;rq=`Do ${lc(ivList)} significantly predict ${lc(dv)}?`;h0=`${cap(ivList)} do not significantly predict ${lc(dv)}.`}
  else if(g==='compare'){title=`${cap(dv)} of ${pop}${set} according to ${lc(iv)}`;purpose=`determine whether ${lc(dv)} differs among ${pop}${set} when grouped according to ${lc(iv)}`;rq=`Is there a significant difference in ${lc(dv)} when respondents are grouped according to ${lc(iv)}?`;h0=`There is no significant difference in ${lc(dv)} when respondents are grouped according to ${lc(iv)}.`}
  else if(g==='effect'){title=`Effect of ${lc(iv)} on ${lc(dv)} of ${pop}${set}`;purpose=`determine the effect of ${lc(iv)} on the ${lc(dv)} of ${pop}${set}`;
    if(S.groups==='2p'){rq=`Is there a significant difference between the pretest and posttest ${lc(dv)} of the respondents?`;h0=`There is no significant difference between the pretest and posttest ${lc(dv)} of the respondents.`}
    else if(S.groups==='3p'){rq=`Is there a significant difference in ${lc(dv)} across the repeated measurements?`;h0=`There is no significant difference in ${lc(dv)} across the repeated measurements.`}
    else{const other=S.groups==='3i'?'other groups':'control group';rq=`Is there a significant difference in the posttest ${lc(dv)} between the group that received ${lc(iv)} and the ${other}?`;h0=`There is no significant difference in the posttest ${lc(dv)} between the group that received ${lc(iv)} and the ${other}.`}}
  else{title=cap(p.topic)||'Untitled study'}
  const qs=[];
  if(demos().length)qs.push({q:`What is the demographic profile of the respondents in terms of ${join(demos().map(v=>lc(v.name)))}?`,t:[...new Set(demos().map(descTool))].join('; ')});
  if(g==='effect'){const d=dvs()[0];if(d){
    if(S.groups==='2p'){qs.push({q:`What is the ${lc(d.name)} of the respondents before the intervention?`,t:descTool(d)});qs.push({q:`What is the ${lc(d.name)} of the respondents after the intervention?`,t:descTool(d)})}
    else qs.push({q:`What is the pretest and posttest ${lc(d.name)} of each group?`,t:descTool(d)})}}
  else named().filter(v=>v.role!=='Demo'&&!(v.role==='IV'&&v.level==='Nominal'&&g==='compare')).forEach(v=>qs.push({q:`What is the level of ${lc(v.name)} of the respondents?`,t:descTool(v)}));
  if(rq){const t=chooseTest();qs.push({q:rq,t:t.issue?'Complete Step 5':t.both?`${t.both[0].name} if normal; ${t.both[1].name} if not`:t.name,main:true})}
  return{title,purpose,rq,h0,qs};
}

// ---------- Validity ----------
function missing(n){
  const m=[],p=S.problem;
  if(n===1){if(!p.topic.trim())m.push('Broad topic area');if(!p.population.trim())m.push('Population (who your respondents are)');if(!p.setting.trim())m.push('Setting (where the study takes place)');if(!p.statement.trim())m.push('The problem you noticed')}
  if(n===2){
    S.vars.forEach((v,i)=>{if(!v.name.trim()&&(v.level||v.measure.trim()))m.push(`Name of variable ${i+1}`)});
    if(!named().some(v=>v.role!=='Demo'))m.push('At least one independent or dependent variable');
    named().forEach(v=>{if(!v.level)m.push(`Level of measurement of ${v.name}`);if(!v.measure.trim())m.push(`Operational definition of ${v.name}`)});
  }
  if(n===3){
    if(!S.goal)m.push('The main aim of your research question');
    else{
      if(S.goal==='effect'&&!S.assign)m.push('Who receives the intervention (random assignment or not)');
      if((S.goal==='effect'&&S.assign||S.goal==='compare')&&!S.groups)m.push('How the groups are arranged');
      if(S.goal!=='describe'&&!ivs().length)m.push('An independent variable (go back to Step 2)');
      if(S.goal!=='describe'&&!dvs().length)m.push('A dependent variable (go back to Step 2)');
      if(!m.length){const t=chooseTest();if(t&&t.issue&&/Step 3/.test(t.issue))m.push(t.issue.replace(/go back to Step 3 and choose/,'in Step 3, choose'))}
    }
  }
  if(n===4&&!S.sampling)m.push('Sampling technique');
  if(n===5){const t=chooseTest();if(t&&t.issue)m.push(t.issue);else if(needsNormality()&&!S.normal)m.push('Whether your scores are normally distributed (choose "Not checked yet" if you have no data yet)')}
  return m;
}
function reachable(n){for(let k=1;k<n;k++)if(missing(k).length)return false;return true}
function stepOk(n){
  if(n===4)return stepOk(3)&&!missing(4).length;
  if(n===6)return[1,2,3,4,5].every(stepOk);
  return!missing(n).length;
}
function gateHtml(n){const m=missing(n);if(!m.length)return'';
  const back=[...new Set(m.map(x=>+((x.match(/Step (\d)/)||[])[1]||0)).filter(k=>k&&k<n))].sort();
  const here=m.filter(x=>{const k=+((x.match(/Step (\d)/)||[])[1]||0);return!k||k>=n});
  return `<div class="note bad gate">${back.length?`<b>There is a problem in an earlier step. You must go back and fix it before you can proceed.</b><ul>${m.filter(x=>!here.includes(x)).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="row" style="margin-top:8px">${back.map(k=>`<button class="btn" type="button" data-fix="${k}">← Go back to Step ${k} to fix it</button>`).join('')}</div>`:''}${here.length?`<b${back.length?' style="display:block;margin-top:10px"':''}>Before you can proceed, you must complete or fix:</b><ul>${here.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`}

function progressBox(){
  if(!hasWork())return `<section class="section"><div class="box soft prog"><span class="label">Your study</span><p style="margin:0">You have not started a study yet. The study builder takes you from your research problem to a complete study blueprint in six steps.</p><div class="row"><a class="btn" href="#builder">Start my study</a></div></div></section>`;

function renderStart(){

// ---------- Test guide ----------
function paramGuide(){
  return `<p>Use a <b>parametric</b> test only when all of these hold:</p><ol><li>The dependent variable is interval or ratio.</li><li>The data are approximately normally distributed. Check with the Shapiro-Wilk test (best for samples under 50) or Kolmogorov-Smirnov. A p-value above 0.05 means the data can be treated as normal.</li><li>Groups have similar variances (Levene's test, p above 0.05) when you compare groups.</li></ol><p>If any one fails, use the <b>non-parametric</b> test. It compares ranks or counts instead of means, so it does not need normal data.</p>`;
}
function renderTests(){
  const t=finderResult(),ok=!t.wait&&!t.issue;const hiRow=ok?rowKey():'',hiNames=ok?(t.both?t.both.map(x=>x.name):[t.name]):[];
  const hiNote=ok&&hiRow?' Your current result from the test finder is highlighted.':'';
  $('#app').innerHTML=`<section class="hero"><span class="label">Reference</span><h1>All statistical tests at a glance</h1><p>Find the row that matches your research question, then the column that matches your dependent variable.${hiNote}</p></section>
  <div class="layout"><div class="work"><div class="box">${testTable(hiRow,hiNames)}</div><div class="box"><h3>Reading your result</h3><p>Set the level of significance before analysis, usually α = 0.05. If p ≤ 0.05, reject the null hypothesis: the relationship or difference is significant. If p &gt; 0.05, fail to reject it.</p><p>For correlations, also report direction (+ or −) and strength. Munro's text (Chapter 11) follows Cohen's guide: an r of about ±0.10 is weak, about ±0.30 is moderate, and ±0.50 or higher is substantial (strong). Use the scale your program prescribes.</p></div></div>
  <aside class="guide"><div class="box soft"><h3>Parametric or non-parametric?</h3>${paramGuide()}</div><div class="box"><h3>Post hoc tests</h3><p class="hint">Run one only when a test with 3 or more groups or time points is significant.</p><ul class="trail">${Object.entries(POSTHOC).map(([n,x])=>`<li><span class="y">→</span><span><b>${esc(n)}</b><br><span class="hint">${esc(x)}</span></span></li>`).join('')}</ul></div><div class="box"><h3>Further reading</h3><p class="hint">Chapters in the reference textbook for each topic:</p><ul class="trail">${[['Describing data, skewness and kurtosis',2],['Probability and the normal distribution',3],['Hypothesis testing, p-values, Type I and II errors',4],['Independent t-test and Mann-Whitney U',5],['Paired t-test and Wilcoxon signed-rank',6],['One-way ANOVA, Kruskal-Wallis and post hoc tests',7],['Two-way (N-way) ANOVA',8],['Repeated-measures ANOVA and Friedman',9],['ANCOVA',10],['Pearson and Spearman correlation',11],['Chi-square, Fisher\'s exact and McNemar',12],['Logistic regression',13],['Linear regression',14]].map(([x,c])=>`<li><span class="y">${c}</span><span>${x}</span></li>`).join('')}</ul><p class="hint" style="margin-top:8px">${esc(MUNRO_CITE)}</p></div></aside></div>`;
}

  ${ex?'':`<div class="restart" id="restart"><button class="ghost" type="button" id="so">↺ Start over</button></div>`}
  <ol class="stepper">${STEPS.map((s,i)=>`<li><button data-s="${i+1}" class="${stepOk(i+1)?'done':''}" ${n===i+1?'aria-current="step"':''} ${reachable(i+1)?'':'disabled'}><span class="sn">Step ${i+1}${stepOk(i+1)?' ✓':reachable(i+1)?'':' · locked'}</span><span class="st">${s}</span></button></li>`).join('')}</ol>

  if(ex)$('#exit').onclick=()=>{S=blank();save();renderTop('build');renderBuild()};

  work.querySelectorAll('button').forEach(b=>{if(/^\+|Clear|Reset|Use this|Fill/.test(b.textContent.trim())&&!b.closest('.navbtns'))b.disabled=true});
}
function go(n){if(!reachable(n))return;S.step=n;save();renderBuild();window.scrollTo({top:0,behavior:'smooth'})}
function refreshStepper(){document.querySelectorAll('[data-s]').forEach(b=>{const ok=stepOk(+b.dataset.s);b.classList.toggle('done',ok);const r=reachable(+b.dataset.s);b.disabled=!r;b.querySelector('.sn').textContent=`Step ${b.dataset.s}${ok?' ✓':r?'':' · locked'}`});
  const n=S.step||1,g=$('#gate'),f=$('#fwd');if(g&&n<6)g.innerHTML=gateHtml(n);if(f)f.disabled=!!missing(n).length}
function soFar(){const w=words();return `<div class="box soft"><span class="label">Working title</span><p class="mini-title">${esc(w.title)}</p>${w.purpose?`<p class="hint">This study aims to ${esc(w.purpose)}.</p>`:''}</div>`}

function step1(work,guide){
  const p=S.problem;
  work.append(el(`<div class="box"><span class="label">Step 1</span><h2>Conceptualize the research problem</h2><p class="hint">Start from something you noticed in clinical practice or school, then say exactly who it affects and where.</p>
  <div class="field"><label for="f-topic">Broad topic area</label><input type="text" id="f-topic" value="${esc(p.topic)}" placeholder="e.g. Fall prevention in older adults"></div>

}

const LV_RULES=[
  ['Nominal',/\b(yes\s*\/\s*no|yes or no|present or absent|dichotom|binary)\b/,'it has two categories with no order, like yes or no'],
  ['Interval',/\b(total score|scale score|composite score|mean score|average score|weighted mean|sum of|summated|likert total|knowledge score|test score|exam score|questionnaire score|score on|scale\)|inventory|questionnaire|°c|°f|celsius|fahrenheit|temperature|iq\b|gpa|grade point|weighted average|general average|gwa|numeric rating|visual analog|vas\b|rating scale)/,'it is a score or reading with equal intervals but no true zero. Scale totals and test scores are usually treated as interval'],
  ['Ratio',/\b(age|weight|height|bmi|body mass|blood pressure|systolic|diastolic|mmhg|heart rate|pulse|respiratory rate|oxygen saturation|spo2|glucose|blood sugar|cholesterol|hemoglobin|hgb|length of stay|number of|no\. of|count|how many|hours?|minutes?|years? of|duration|sleep duration|income|salary|peso|cost|kg|kilogram|cm|mg|ml|dose|distance|steps|falls|frequency of)\b/,'it is a measured amount or count with equal units and a true zero (0 means none)'],
  ['Ordinal',/\b(level of|stage|grade|rank|rating|degree of|severity|mild|moderate|severe|low|high|satisfaction|agree|likert item|single item|year level|educational attainment|highest education|socioeconomic|ses\b|income bracket|class\b|frequency|never|sometimes|always|triage|pain)\b/,'its categories have a natural order, but the gaps between them are not equal'],
  ['Nominal',/\b(sex|gender|civil status|marital|religion|ethnic|nationality|blood type|ward|unit|department|area|type of|kind of|shift|occupation|employment|job|course|program|programme|school|hospital|residence|living arrangement|province|city|intervention|treatment|teaching|training|education session|exercise|therapy|group|status)\b/,'it sorts people into named categories with no order']];
function suggestLevel(v){
  const m=(v.measure||'').toLowerCase(),n=(v.name||'').toLowerCase();if(!n.trim()&&!m.trim())return null;
  const hit=(txt,from,only)=>{for(const [lv,re,why] of LV_RULES)if((!only||only.includes(lv))&&txt&&re.test(txt))return{lv,why,from};return null};
  if(v.role==='IV'&&/\b(program|programme|intervention|treatment|teaching|training|education|session|therapy|exercise|module|protocol)\b/.test(n))return{lv:'Nominal',why:'an intervention is usually recorded as received or not received (intervention vs control group)',from:'name'};
  const yn=LV_RULES[0];if(yn[1].test(m)||yn[1].test(n))return{lv:'Nominal',why:yn[2],from:yn[1].test(m)?'operational definition':'name'};
  const sc=hit(m,'operational definition',['Interval']);if(sc)return sc;
  const nm=hit(n,'name');if(nm&&nm.lv==='Nominal')return nm;
  const nx=/\b(day|evening)\b.*\b(evening|night)\b|\bmale\b.*\bfemale\b|\bsingle\b.*\bmarried\b|\bpublic\b.*\bprivate\b/.test(m)?{lv:'Nominal',why:'it lists named categories with no order',from:'operational definition'}:null;if(nx)return nx;
  return nm||hit(m,'operational definition');
}
function suggHtml(v){
  const g=suggestLevel(v);if(!g)return v.name.trim()?'<span class="hint">No suggestion yet. Describe how you will measure it in the operational definition.</span>':'';
  if(v.level===g.lv)return `<span class="sugg-ok">✓ Matches the suggested level (${g.lv}).</span>`;
  return `<span><b>Suggested: ${g.lv}.</b> Based on the ${g.from}, ${esc(g.why)}.</span> <button type="button" class="ghost sugg-use" data-lv="${g.lv}">Use ${g.lv}</button>`;
}
function step2(work,guide){
  const box=el(`<div class="box"><span class="label">Step 2</span><h2>Identify your variables</h2><p class="hint">List what you will change, measure or describe. For each one, set its role and level of measurement, and say how you will measure it.</p><div class="vars" id="vars"></div>
  <div class="row"><button class="ghost" data-add="IV">+ Independent variable</button><button class="ghost" data-add="DV">+ Dependent variable</button><button class="ghost" data-add="Demo">+ Demographic variable</button></div></div>`);
  work.append(box);
  const draw=()=>{const list=box.querySelector('#vars');list.innerHTML='';
    S.vars.forEach((v,i)=>{const r=el(`<div class="var" data-role="${v.role}">
      <div class="field nm"><label for="vn${i}">Variable name</label><input type="text" id="vn${i}" value="${esc(v.name)}" placeholder="${v.role==='IV'?'e.g. Health teaching on fall prevention':v.role==='DV'?'e.g. Number of falls':'e.g. Age'}"></div>
      <div class="field"><label for="vr${i}">Role</label><select id="vr${i}">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${v.role===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label for="vl${i}">Level of measurement</label><select id="vl${i}"><option value="">Choose…</option>${LEVELS.map(l=>`<option ${v.level===l?'selected':''}>${l}</option>`).join('')}</select></div>
      <button class="del" aria-label="Remove ${esc(v.name||'variable')}" title="Remove">✕</button>
      <div class="field full"><label for="vm${i}">Operational definition (how will you measure it?)</label><input type="text" id="vm${i}" value="${esc(v.measure)}" placeholder="Instrument, unit or procedure"></div>
      <div class="sugg full" aria-live="polite">${suggHtml(v)}</div>
      ${v.level?`<p class="hint full">${LEVEL_HINT[v.level]}</p>`:''}</div>`);
      const upd=()=>{r.querySelector('.sugg').innerHTML=suggHtml(v);const u=r.querySelector('.sugg-use');if(u)u.onclick=()=>{v.level=u.dataset.lv;save();draw();refreshStepper()}};upd();
      r.querySelector(`#vn${i}`).oninput=e=>{v.name=e.target.value;save();refreshStepper();upd();const mt=guide.querySelector('.mini-title');if(mt)mt.textContent=words().title};
      r.querySelector(`#vm${i}`).oninput=e=>{v.measure=e.target.value;save();refreshStepper();upd()};
      r.querySelector(`#vr${i}`).onchange=e=>{v.role=e.target.value;save();draw();refreshStepper()};
      r.querySelector(`#vl${i}`).onchange=e=>{v.level=e.target.value;save();draw();refreshStepper()};
      r.querySelector('.del').onclick=()=>{S.vars.splice(i,1);save();draw();refreshStepper()};
      list.append(r)});
    if(!S.vars.length)list.innerHTML='<p class="hint">No variables yet. Add one below.</p>';
  };
  box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.vars.push({name:'',role:b.dataset.add,level:'',measure:''});save();draw();box.querySelector(`#vn${S.vars.length-1}`).focus()});
  draw();
  guide.innerHTML=soFar()+`<div class="box"><h3>Variable roles</h3><ul><li><b>Independent:</b> the presumed cause, the intervention, or the grouping you compare.</li><li><b>Dependent:</b> the outcome you measure. It drives the choice of statistical test.</li><li><b>Demographic:</b> respondent profile such as age, sex or years of experience.</li></ul></div>
  <div class="box"><h3>Levels of measurement (NOIR)</h3><ul>${LEVELS.map(l=>`<li><b>${l}:</b> ${LEVEL_HINT[l]}</li>`).join('')}</ul><p class="hint">A Likert total or average score is usually treated as interval. Follow your adviser's convention.</p><p class="hint">The app suggests a level from the words in each variable's name and operational definition. It is only a suggestion: you decide.</p></div>`;
}

function choiceGroup(title,key,opts,after){
  const box=el(`<div class="field"><span style="font-weight:600">${title}</span><div class="choices"></div></div>`);
  opts.forEach(o=>{const b=el(`<button class="choice" aria-pressed="${S[key]===o.v}"><b>${esc(o.l)}</b><small>${esc(o.s)}</small></button>`);b.onclick=()=>{S[key]=o.v;if(after)after(o.v);save();renderBuild()};box.querySelector('.choices').append(withInfo(b,key+':'+o.v))});
  return box;
}
function step3(work,guide){
  const iv=ivs()[0]?.name||'X',dv=dvs()[0]?.name||'Y';
  const box=el(`<div class="box"><span class="label">Step 3</span><h2>What does your research question ask?</h2><p class="hint">The aim of your question, together with your variables, decides the design and the test.</p></div>`);
  box.append(choiceGroup('Main aim','goal',[
    {v:'describe',l:'Describe',s:`"What is the level of ${lc(dv)}?"`},
    {v:'relate',l:'Find a relationship',s:`"Is ${lc(iv)} related to ${lc(dv)}?"`},
    {v:'compare',l:'Compare existing groups',s:`"Does ${lc(dv)} differ by ${lc(iv)}?" with no intervention`},

    if(S.assign)box.append(choiceGroup('How are the groups and measurements arranged?','groups',S.assign==='random'?[
      {v:'2i',l:'Intervention and control group',s:'Two groups, measured before and after'},
      {v:'3i',l:'Three or more groups',s:'e.g. two interventions and a control'}]:[
      {v:'2p',l:'One group, before and after',s:'Pretest, intervention, posttest'},
      {v:'2i',l:'Intervention and comparison group',s:'Two existing groups'},

  if(S.goal==='compare')box.append(choiceGroup(`How many groups does ${lc(iv)} form?`,'groups',[
    {v:'2i',l:'Two groups',s:'e.g. male and female, public and private'},
    {v:'3i',l:'Three or more groups',s:'e.g. day, evening and night shift'}]));
  work.append(box);
  const warn=[];
  if(S.goal&&S.goal!=='describe'&&!dvs().length)warn.push('This aim needs a dependent variable. Add one in Step 2.');
  if(S.goal&&S.goal!=='describe'&&!ivs().length)warn.push('This aim needs an independent variable. Add one in Step 2.');
  if(S.goal==='compare'&&ivs()[0]&&isNum(ivs()[0].level))warn.push(`To compare groups, ${ivs()[0].name} should be a category (nominal or ordinal). If it is a score, "Find a relationship" may fit better.`);
  warn.forEach(w=>work.append(el(`<p class="note bad">${esc(w)}</p>`)));
  const w=words();
  if(w.rq)work.append(el(`<div class="box"><span class="label">Your main research question</span><p class="mini-title">${esc(w.rq)}</p><span class="label">Null hypothesis (H₀)</span><p>${esc(w.h0)}</p></div>`));
  guide.innerHTML=soFar()+`<div class="box"><h3>Aim → design family</h3><ul><li><b>Describe</b> → descriptive survey</li><li><b>Relationship</b> → correlational</li><li><b>Compare existing groups</b> → comparative</li><li><b>Test an intervention</b> → experimental or quasi-experimental</li><li><b>Predict</b> → predictive correlational</li></ul></div>
  <div class="box"><h3>Hypotheses</h3><p>The <b>null hypothesis (H₀)</b> says there is no relationship or difference. It is what the statistical test checks. Descriptive questions do not need one.</p></div>`;
}

const SAMPLE_TECH=[
  {v:'simple',l:'Simple random sampling',k:'p',s:'Lottery or random number generator',d:'every member of the population has an equal chance of being selected, for example by lottery or a random number generator'},
  {v:'systematic',l:'Systematic random sampling',k:'p',s:'Every kth person on a list',d:'every kth person on the population list is selected after a random start (k = N ÷ n)'},
  {v:'stratified',l:'Stratified random sampling',k:'p',s:'Random sampling within subgroups',d:'the population is divided into subgroups (strata) such as year level or ward, and respondents are randomly selected from each, usually in proportion to its size'},
  {v:'cluster',l:'Cluster sampling',k:'p',s:'Randomly select whole wards or sections',d:'whole groups such as wards, sections or schools are randomly selected and everyone in them is included'},
  {v:'census',l:'Total enumeration',k:'c',s:'Everyone in a small population',d:'all members of the population are included, so no sampling is done'},
  {v:'purposive',l:'Purposive sampling',k:'n',s:'Chosen by inclusion criteria',d:'respondents are chosen because they meet the inclusion criteria set by the researcher'},
  {v:'convenience',l:'Convenience sampling',k:'n',s:'Whoever is available and willing',d:'respondents who are available and willing to take part during the data collection period are included'},
  {v:'quota',l:'Quota sampling',k:'n',s:'Fill a set number per subgroup',d:'a set number of respondents is taken from each subgroup, but not randomly'},
  {v:'snowball',l:'Snowball sampling',k:'n',s:'Respondents refer others',d:'initial respondents refer others who meet the criteria, which helps reach hidden or hard-to-reach groups'}];
function studyType(){return S.goal==='effect'?(S.assign==='random'?'true':'quasi'):{describe:'descriptive',relate:'correlational',compare:'comparative',predict:'predictive'}[S.goal]||''}
const SAMPLE_REC={descriptive:['simple','stratified','systematic','census'],correlational:['simple','stratified','systematic','census'],predictive:['simple','stratified','systematic'],comparative:['stratified','simple'],quasi:['purposive','convenience','cluster'],true:['simple','purposive','convenience']};
function samplingLine(){const t=SAMPLE_TECH.find(x=>x.v===S.sampling);if(!t)return'';return `The study will use ${lc(t.l)}, in which ${t.d}.${studyType()==='true'?' Participants will then be randomly assigned to the intervention or control group.':''}`}
function samplingPicker(){
  const ty=studyType(),rec=SAMPLE_REC[ty]||[],tech=SAMPLING[ty]?.tech||'';
  const box=el(`<div class="box"><span class="label">Sampling technique</span><h3>How will you select your respondents?</h3>${tech?`<p class="hint">Usually recommended for this design: <b>${esc(tech)}</b>.</p>`:''}</div>`);
  const grp=(title,k)=>box.append(choiceGroup(title,'sampling',SAMPLE_TECH.filter(t=>t.k===k||(k==='p'&&t.k==='c')).map(t=>({v:t.v,l:t.l+(rec.includes(t.v)?' ★':''),s:t.s}))));
  grp('Probability sampling (random)','p');grp('Non-probability sampling','n');
  box.append(el(`<p class="hint">★ fits your design well.</p>`));
  const t=SAMPLE_TECH.find(x=>x.v===S.sampling);
  if(t){const notes=[];
    if(t.k==='n'&&['descriptive','correlational','predictive','comparative'].includes(ty))notes.push('Non-probability sampling limits how far your results generalize. State it as a limitation of the study.');
    if(t.v==='census')notes.push('With total enumeration you do not need Slovin\'s formula, because your sample is the whole population.');
    if(ty==='true')notes.push('Whatever technique you use to recruit, a true experiment still needs random assignment of participants to the intervention and control groups.');
    if(ty==='quasi'&&t.k==='p')notes.push('Random sampling is good, but without random assignment to groups the design stays quasi-experimental.');
    box.append(el(`<p class="note">${esc(cap(samplingLine()))}${notes.length?'<br><br>'+notes.map(esc).join(' '):''}</p>`))}

}
function step4(work,guide){
  const d=design();
  if(!d){work.append(el(`<div class="box"><span class="label">Step 4</span><h2>Research design</h2><p class="note">Choose your main aim in Step 3 first.</p></div>`));guide.innerHTML=soFar();return}
  const iv=ivs()[0]?.name||'the independent variable';
  const tr=[];
  if(S.goal==='effect'){tr.push(['y',`You will give an intervention (${lc(iv)}).`]);tr.push(S.assign==='random'?['y','Participants are randomly assigned.']:['n','Participants are not randomly assigned.']);tr.push(S.groups==='2p'||S.groups==='3p'?['n','There is no separate control group.']:['y','There is a comparison or control group.'])}
  else{tr.push(['n','You will not give an intervention, so the design is non-experimental.']);tr.push(['y',{describe:'You only describe the variables.',relate:'You test a relationship between two variables.',predict:'You test which variables predict an outcome.',compare:'You compare groups that already exist.'}[S.goal]])}
  work.append(el(`<div class="result"><span class="label">Step 4 · Suggested research design</span><span class="badge ${d.type==='Non-experimental'?'neutral':''}">${d.type}</span><p class="big">${esc(d.name)}</p><p>${esc(d.why)}</p>
  <div><span class="label">How we decided</span><ul class="trail" style="margin-top:6px">${tr.map(([k,t])=>`<li><span class="${k}">${k==='y'?'✓':'✕'}</span><span>${esc(t)}</span></li>`).join('')}</ul></div>
  ${d.nota?`<div><span class="label">Design notation</span><div class="notation" style="margin-top:6px">${esc(d.nota)}</div><p class="hint" style="margin-top:6px">R = random assignment · O = observation or measurement · X = intervention · dashed line = groups not randomly formed</p></div>`:''}
  ${d.time?`<p class="hint">Most studies like this are <b>cross-sectional</b>: data are collected once. If you measure the same respondents several times, call it <b>longitudinal</b>.</p>`:''}</div>`));
  guide.innerHTML=soFar()+`<div class="box"><h3>Experimental or not?</h3><p>A <b>true experiment</b> has all three: manipulation (you give the intervention), control (a comparison group) and randomization.</p><p>Missing randomization or a control group makes it <b>quasi-experimental</b>. No intervention at all makes it <b>non-experimental</b>.</p></div>
  <div class="box"><h3>Validity</h3><p><b>Internal validity</b> is confidence that the independent variable caused the change. Threats include history, maturation, testing and dropout. <b>External validity</b> is how far results generalize.</p></div>`+slovinGuide();
  work.append(samplingPicker());
  const sw=slovinWidget(S,save);sw.querySelector('.label').textContent='Population and sample';work.append(sw);
}

function testCard(t,label){
  const np=t.kind==='np';
  return `<div class="result ${np?'np':''}"><span class="label">${label}</span><span class="badge ${np?'np':t.kind==='o'?'neutral':''}">${t.kind==='p'?'Parametric':np?'Non-parametric':'Descriptive / model'}</span><p class="big">${esc(t.name)}</p><p>${esc(t.why)}</p>${t.alt?`<p class="hint">If a normality or variance check later fails, switch to <b>${esc(t.alt.name)}</b> (non-parametric).</p>`:''}</div>`;
}
function step5(work,guide){
  const dv=dvs()[0];
  const head=el(`<div class="box"><span class="label">Step 5</span><h2>Choose the statistical test</h2>${dv?`<p>Your dependent variable is <b>${esc(dv.name)}</b>, measured at the <b>${esc((dv.level||'?').toLowerCase())}</b> level.</p>`:''}</div>`);
  work.append(head);
  if(S.goal&&S.goal!=='describe'&&dv){
    const checks=[];
    checks.push(isNum(dv.level)?['y',`The dependent variable is ${dv.level.toLowerCase()}.`]:['n',`The dependent variable is ${(dv.level||'not set').toLowerCase()}, not interval or ratio.`]);
    if(needsNormality())checks.push(S.normal==='yes'?['y','The data are normally distributed.']:S.normal==='no'?['n','The data are not normally distributed.']:['q','Normality not checked yet.']);
    head.append(el(`<div><span class="label">Parametric checklist</span><ul class="trail" style="margin-top:6px">${checks.map(([k,t])=>`<li><span class="${k}">${k==='y'?'✓':k==='n'?'✕':'?'}</span><span>${esc(t)}</span></li>`).join('')}</ul></div>`));
    if(needsNormality())head.append(choiceGroup('Are your scores normally distributed?','normal',[
      {v:'yes',l:'Yes, normal',s:'Shapiro-Wilk p > 0.05'},
      {v:'no',l:'No, not normal',s:'Shapiro-Wilk p ≤ 0.05, or very skewed'},
      {v:'unsure',l:'Not checked yet',s:'Show me both options'}]));
  }
  const t=chooseTest();
  if(t.issue)work.append(el(`<p class="note bad">${esc(t.issue)}</p>`));
  else if(t.both)work.append(el(`<div class="split">${testCard(t.both[0],'If your data are normal')}${testCard(t.both[1],'If your data are not normal')}</div>`));
  else work.append(el(testCard(t,S.goal==='describe'?'Suggested statistics':'Suggested inferential test')));
  const rows=named();
  if(rows.length)work.append(el(`<div class="box"><h3>Descriptive statistics for each variable</h3><div class="tbl"><table><thead><tr><th>Variable</th><th>Level</th><th>Describe it with</th></tr></thead><tbody>${rows.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.level||'–')}</td><td>${esc(descTool(v))}</td></tr>`).join('')}</tbody></table></div></div>`));
  work.append(el(`<details class="box"><summary>See the full test guide</summary>${testTable()}</details>`));
  guide.innerHTML=soFar()+`<div class="box"><h3>Parametric or non-parametric?</h3>${paramGuide()}</div><div class="box"><h3>Reading the result</h3><p>With α = 0.05: if p ≤ 0.05, reject H₀ (significant). If p &gt; 0.05, fail to reject H₀.</p></div>`;
}

function sampleLine(){
  const r=slovin(S.N,S.e);
  if(!r)return'';
  return `Using Slovin's formula, n = N / (1 + N × e²), with a population of ${r.N.toLocaleString('en-US')} and a margin of error of ${r.e}, the minimum sample size is ${r.n.toLocaleString('en-US')} respondents (${fmt(r.raw,2)} rounded up).`;
}
function blueprintText(){
  const w=words(),d=design(),t=chooseTest(),p=S.problem;
  const L=[];L.push(w.title.toUpperCase(),'');
  if(p.statement.trim())L.push('BACKGROUND OF THE PROBLEM',p.statement.trim(),'');
  if(w.purpose)L.push('GENERAL OBJECTIVE','This study aims to '+w.purpose+'.','');
  L.push('STATEMENT OF THE PROBLEM');w.qs.forEach((q,i)=>L.push(`${i+1}. ${q.q}`));L.push('');
  if(w.h0)L.push('HYPOTHESIS','H₀: '+w.h0,'');
  L.push('VARIABLES');named().forEach(v=>L.push(`- ${v.name} (${ROLES[v.role]}, ${v.level||'level not set'}): ${v.measure||'operational definition not set'}`));L.push('');
  if(d)L.push('RESEARCH DESIGN',`${d.name} (${d.type}). ${d.why}`,'');
  if(sampleLine())L.push('POPULATION AND SAMPLE',sampleLine(),'');

}
function step6(work,guide){

  <section><h3>Variables</h3><div class="tbl"><table><thead><tr><th>Variable</th><th>Role</th><th>Level</th><th>Operational definition</th></tr></thead><tbody>${named().map(v=>`<tr><td>${esc(v.name)}</td><td>${ROLES[v.role]}</td><td>${esc(v.level||'–')}</td><td>${esc(v.measure||'–')}</td></tr>`).join('')}</tbody></table></div></section>
  ${d?`<section><h3>Research design</h3><p><b>${esc(d.name)}</b> (${esc(d.type.toLowerCase())}). ${esc(d.why)}</p>${d.nota?`<div class="notation">${esc(d.nota)}</div>`:''}</section>`:''}

  <section><h3>Sampling technique</h3>${samplingLine()?`<p>${esc(samplingLine())}</p>`:`<p class="hint">Choose a sampling technique in Step 4.</p>`}</section>
  <section><h3>Statistical treatment</h3><div class="tbl"><table><thead><tr><th>Problem</th><th>Statistical tool</th></tr></thead><tbody>${w.qs.map((q,i)=>`<tr><td>${i+1}. ${esc(q.q)}</td><td>${esc(q.t)}${q.main&&t&&!t.issue&&!t.both?` <span class="tag ${t.kind==='np'?'np':''}">${t.kind==='p'?'Parametric':t.kind==='np'?'Non-parametric':'Model'}</span>`:''}</td></tr>`).join('')}</tbody></table></div>${w.h0?'<p class="hint">Level of significance: α = 0.05.</p>':''}</section></article>`));
  const row=el(`<div class="row"><button class="btn" id="copy">Copy blueprint as text</button><span class="hint" id="copyMsg"></span></div>`);work.append(row);

    const fallback=()=>{ta.value=txt;ta.hidden=false;ta.focus();ta.select();$('#copyMsg').textContent='Copying is blocked here. The text is selected below, so copy it manually.'};
    try{navigator.clipboard.writeText(txt).then(()=>{$('#copyMsg').textContent='Copied. Paste it into your research paper draft.'},fallback)}catch(e){fallback()}};
  guide.innerHTML=`<div class="box"><h3>What comes next</h3><ol><li>Choose a sampling technique, such as simple random or stratified random sampling.</li><li>Select or build your instrument and report its validity and reliability (Cronbach's alpha of 0.70 or higher is usually acceptable).</li><li>Secure ethics review approval and informed consent.</li><li>Pilot test, collect data, then run the tests listed here.</li></ol></div>
  <div class="box"><h3>Check with your adviser</h3><p>The builder suggests the usual choice for your variables. Your adviser or statistician should confirm the final design and tests.</p></div>`;
}

const FKEY='evidence-rounds-finder-v1';

const TYPES=[
  {v:'descriptive',l:'Descriptive',s:'Describes a level, profile or practice'},

const GROUP_OPTS={

const FEX=[
  {l:'Walking program and blood pressure',f:{type:'quasi',groups:'2p',dv:'Ratio',normal:'yes',iv:''}},

  {l:'Stress across three shifts',f:{type:'comparative',groups:'3i',dv:'Interval',normal:'yes',iv:''}},
  {l:'Smoking and hypertension (yes/no)',f:{type:'correlational',iv:'Nominal',dv:'Nominal',normal:'',groups:''}},

function fQuestions(){
  const q=[],t=F.type;
  if(!t)return q;
  if(t==='descriptive')q.push({k:'dv',t:'What is the level of measurement of the variable you are describing?',lv:true});
  if(t==='correlational'){q.push({k:'iv',t:'Level of measurement of the first variable (X)',lv:true});q.push({k:'dv',t:'Level of measurement of the second variable (Y)',lv:true})}
  if(TYPE_GROUPS[t]){q.push({k:'groups',t:t==='comparative'?'How many groups are you comparing?':'How are the groups and measurements arranged?',opts:TYPE_GROUPS[t].map(g=>({v:g,...GROUP_OPTS[g]}))});q.push({k:'dv',t:'Level of measurement of the outcome (dependent variable)',lv:true})}
  if(t==='predictive'){q.push({k:'npred',t:'How many predictors (independent variables) do you have?',opts:[{v:'1',l:'One predictor',s:'e.g. hours of sleep predicting exam score'},{v:'many',l:'Two or more predictors',s:'e.g. age, workload and sleep predicting stress'}]});q.push({k:'dv',t:'Level of measurement of the outcome you want to predict',lv:true})}
  const numDV=isNum(F.dv),needN=t==='correlational'?(isNum(F.iv)&&numDV):(TYPE_GROUPS[t]&&numDV);
  if(needN)q.push({k:'normal',t:'Are the scores normally distributed?',opts:[{v:'yes',l:'Yes, normal',s:'Shapiro-Wilk p > 0.05'},{v:'no',l:'No, not normal',s:'Shapiro-Wilk p ≤ 0.05, or very skewed'},{v:'unsure',l:'Not checked yet',s:'Show both options'}]});
  return q;
}
function withTemp(fn){

  S={problem:{topic:'',population:'',setting:'',statement:''},vars:[{name:'The independent variable',role:'IV',level:F.type==='correlational'?F.iv:'Nominal',measure:''},{name:'The dependent variable',role:'DV',level:F.dv,measure:''}],
     goal,assign:F.type==='true'?'random':F.type==='quasi'?'nonrandom':'',groups:F.groups,npred:F.npred||'',normal:F.normal==='unsure'?'':F.normal};
  try{return fn()}finally{S=keep}
}
function finderResult(){
  if(!F.type)return{wait:'Start by choosing the type of research.'};
  const open=fQuestions().find(q=>!F[q.k]);

  if(F.type==='descriptive'){const n=descTool({level:F.dv});return{kind:'o',name:n,why:`Descriptive research does not test a hypothesis. ${F.dv} data are summarized with ${lc(n)}.`}}

  {k:'3p',l:'Compare the same group 3 or more times',c:['Repeated-measures ANOVA','Friedman test','Cochran\'s Q test']},
  {k:'ancova',l:'Compare groups on the posttest, adjusting for the pretest',c:['ANCOVA (analysis of covariance)','Quade test (rank ANCOVA)','Binary logistic regression']},
  {k:'mixed',l:'Compare 2 or more groups measured over time',c:['Mixed (split-plot) ANOVA','Friedman (within each group) + Mann-Whitney U or Kruskal-Wallis (between groups)','Generalized estimating equations (GEE)']},

function testTable(hiRow,hiNames){
  hiNames=hiNames||[];
  return `<div class="tbl"><table><thead><tr><th>What you want to know</th><th>Parametric<br>(interval/ratio, normal)</th><th>Non-parametric<br>(ordinal or not normal)</th><th>Nominal outcome</th></tr></thead><tbody>${TEST_ROWS.map(r=>`<tr class="${r.k===hiRow?'hirow':''}"><td>${r.l}</td>${r.c.map(c=>`<td class="${r.k===hiRow&&hiNames.includes(c)?'hi':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const MUNRO={'Independent samples t-test':5,'Mann-Whitney U test':5,'Paired samples t-test':6,'Wilcoxon signed-rank test':6,'One-way ANOVA':7,'Kruskal-Wallis H test':7,'Two-way ANOVA':8,'Repeated-measures ANOVA':9,'Friedman test':9,'ANCOVA (analysis of covariance)':10,'Pearson product-moment correlation (r)':11,'Spearman rank-order correlation (rho)':11,'Chi-square test of independence':12,'McNemar test':12,'Binary logistic regression':13,'Simple linear regression':14,'Multiple linear regression':14};

function fCard(t,label){
  const np=t.kind==='np';
  return `<div class="result ${np?'np':''}"><span class="label">${label}</span><span class="badge ${np?'np':t.kind==='o'?'neutral':''}">${t.kind==='p'?'Parametric':np?'Non-parametric':F.type==='descriptive'?'Descriptive':'Regression model'}</span><p class="big">${esc(t.name)}</p><p>${esc(t.why)}</p>${t.design?`<p class="hint"><b>Typical design:</b> ${esc(t.design)}</p>`:''}${t.alt?`<p class="hint">If the normality or equal-variance check fails, use <b>${esc(t.alt.name)}</b> (non-parametric) instead.</p>`:''}${TEST_TO_GP[t.name]?`<a class="ghost" href="#power" data-gp="${TEST_TO_GP[t.name]}" style="align-self:flex-start">Find the sample size for this test (G*Power) →</a>`:''}${munroLine(t.name)}${HTESTS.includes(t.name)?`<a href="#hypothesis" data-hyp="${esc(t.name)}" style="align-self:flex-start;font-weight:600">After running it: interpret your p-value →</a>`:''}</div>`;
}
function renderFinder(){
  const app=$('#app');
  app.innerHTML=`<section class="hero"><span class="label">Quantitative nursing research</span><h1>Which statistical test should I use?</h1><p>Choose your type of research and the level of measurement of your variables. The app tells you the appropriate statistical test, whether it is parametric or non-parametric, and why.</p><p class="hint" style="font-size:.95rem">New to this? <a href="#examples">Try an example</a> first, or open the <a href="#tests">reference table</a> of all tests.</p></section>
  <div class="layout"><div class="work" id="fq"></div><aside class="guide" id="fr"></aside></div>
  <section class="section"><div class="box soft"><h3>Planning a whole study?</h3><p>The study builder walks you from the research problem and variables to the design, the test and Slovin's sample size, then writes a study blueprint.</p><div class="row"><a class="btn" href="#builder">Open the study builder</a></div></div></section>`;
  const draw=()=>{
    const fq=$('#fq');fq.innerHTML='';

    fq.append(b1);
    const qs=fQuestions(),core=qs.filter(q=>q.k!=='normal'),coreDone=F.type&&core.every(q=>F[q.k]);
    let num=1;
    const addCalc=()=>{const st=S&&hasWork()?S:calcOnly;const w=slovinWidget(st,()=>{if(st===S)save();else{try{localStorage.setItem('evidence-rounds-calc',JSON.stringify(calcOnly))}catch(e){}}});
      num++;w.querySelector('.label').textContent=`Question ${num} · Sample size`;w.querySelector('h3').textContent='How many respondents will you need?';
      w.append(el(`<p class="hint">Optional. Your sample size comes from your population and design. It does not change which test you use, but you need it before you collect the data you will test for normality.</p>`));fq.append(w)};
    let blocked=false;
    const lock=()=>{if(blocked==='shown')return;blocked='shown';fq.append(el(`<div class="box locked" aria-disabled="true"><span class="label">Question ${num+1} · Locked</span><p class="gate" style="margin:0"><b>Answer question ${num} first.</b> This question opens once it is answered.</p></div>`))};
    if(!F.type)lock();
    qs.forEach((q,i)=>{
      if(blocked)return;
      if(q.k==='normal'&&coreDone)addCalc();
      num++;
      const bx=el(`<div class="box"><span class="label">Question ${num}</span><h3>${esc(q.t)}</h3><div class="choices"></div></div>`);
      const opts=q.lv?LEVELS.map(l=>({v:l,l,s:LEVEL_EX[l]})):q.opts;
      opts.forEach(o=>{const b=el(`<button class="choice" aria-pressed="${F[q.k]===o.v}"><b>${esc(o.l)}</b><small>${esc(o.s)}</small></button>`);b.onclick=()=>{F[q.k]=o.v;if(q.k!=='normal'&&!fQuestions().some(x=>x.k==='normal'))F.normal='';fsave();draw()};bx.querySelector('.choices').append(withInfo(b,(q.lv?'level':q.k)+':'+o.v))});
      fq.append(bx);
      if(!F[q.k]){blocked=true;if(i<qs.length-1)lock()}});
    if(coreDone&&!qs.some(q=>q.k==='normal'))addCalc();
    if(F.type){const r=el(`<button class="ghost" style="align-self:flex-start">Start over</button>`);r.onclick=()=>{F={type:'',iv:'',dv:'',groups:'',normal:''};fsave();draw()};fq.append(r)}

    else if(t.issue)fr.innerHTML=`<p class="note bad">${esc(t.issue.replace('go back to Step 3 and choose "Compare existing groups"','choose Comparative as the type of research'))}</p>`;

      if(F.normal)checks.push(F.normal==='yes'?['y','Scores are normally distributed.']:F.normal==='no'?['n','Scores are not normally distributed.']:['q','Normality not checked yet.']);
      fr.append(el(`<div class="box"><span class="label">Why parametric or not</span><ul class="trail">${checks.map(([k,x])=>`<li><span class="${k}">${k==='y'?'✓':k==='n'?'✕':'?'}</span><span>${esc(x)}</span></li>`).join('')}</ul><p class="hint">Parametric tests need an interval or ratio outcome that is normally distributed. If either fails, use the non-parametric test.</p></div>`));
    }
    if(!t.wait&&!t.issue&&F.type!=='descriptive'){const ab=assumeBox(names);if(ab)fr.append(ab);const ph=postHocBox(names);if(ph)fr.append(ph)}
    if(F.type&&!t.issue){const sb=samplingBox();if(sb)fr.append(sb)}
    if(!t.wait&&!t.issue)fr.append(writeupBox(t));
    fr.querySelectorAll('[data-hyp]').forEach(a=>a.onclick=()=>{H.kind='';H.test='';hFromFinder();H.test=a.dataset.hyp;hsave()});
    fr.querySelectorAll('[data-gp]').forEach(a=>a.onclick=()=>{const k=a.dataset.gp;if(GP.test!==k){GP.test=k;GP.es=String(ES_INFO[GP_TESTS[k].es].conv[1][1])}if(GP_TESTS[k].k&&F.groups==='3i')GP.k=GP.k||'3';gsave()});
  };
  draw();
}

// ---------- assumptions for each test ----------
const ASSUME={
  'Independent samples t-test':[['Interval or ratio outcome','Check the level of measurement of the dependent variable.'],['Independent groups','Each respondent belongs to only one group.'],['Normal distribution in each group','Shapiro-Wilk p > 0.05 in each group.'],['Equal variances','Levene\'s test p > 0.05. If p ≤ 0.05, report Welch\'s t-test instead.'],['No extreme outliers','Look at a boxplot of each group.']],
  'Paired samples t-test':[['Interval or ratio outcome','Same scale used at both time points.'],['Paired observations','The same respondents are measured twice (pretest and posttest).'],['Differences are normal','Shapiro-Wilk on the posttest minus pretest differences, p > 0.05.'],['No extreme outliers in the differences','Look at a boxplot of the differences.']],
  'One-way ANOVA':[['Interval or ratio outcome','Check the level of measurement of the dependent variable.'],['Independent groups','Each respondent belongs to only one group.'],['Normal distribution in each group','Shapiro-Wilk p > 0.05 in each group.'],['Equal variances','Levene\'s test p > 0.05. If p ≤ 0.05, use Welch\'s ANOVA with Games-Howell post hoc.'],['No extreme outliers','Look at a boxplot of each group.']],
  'Repeated-measures ANOVA':[['Interval or ratio outcome','Same scale used at every time point.'],['Same respondents at every time point','No one is measured only once.'],['Normal distribution at each time point','Shapiro-Wilk p > 0.05.'],['Sphericity','Mauchly\'s test p > 0.05. If violated, report the Greenhouse-Geisser correction.']],
  'Pearson product-moment correlation (r)':[['Both variables interval or ratio','Check the level of measurement of both variables.'],['Linear relationship','The scatterplot shows a straight-line pattern.'],['Both variables roughly normal','Shapiro-Wilk p > 0.05 for each variable.'],['No extreme outliers','Look for isolated points on the scatterplot.']],
  'Multiple linear regression':[['Interval or ratio outcome','Check the level of measurement of the dependent variable.'],['Linear relationships','Scatterplots of the outcome against each predictor.'],['Independent residuals','Durbin-Watson between 1.5 and 2.5.'],['Equal spread of residuals (homoscedasticity)','Residuals versus predicted plot shows no funnel shape.'],['Normal residuals','Histogram or P-P plot of residuals.'],['No multicollinearity','VIF below 10 (stricter: below 5) for each predictor.']],
  'ANCOVA (analysis of covariance)':[['Interval or ratio outcome and covariate','The pretest (covariate) and posttest are numeric scores.'],['Normal residuals in each group','Shapiro-Wilk p > 0.05.'],['Equal variances','Levene\'s test p > 0.05.'],['Linear covariate-outcome relationship','Scatterplot of pretest against posttest in each group.'],['Homogeneity of regression slopes','The group × pretest interaction is not significant (p > 0.05).']],
  'Two-way ANOVA':[['Interval or ratio outcome','Check the level of measurement of the dependent variable.'],['Independent groups','Each respondent belongs to one cell only.'],['Normal distribution in each cell','Shapiro-Wilk p > 0.05 for each combination of groups.'],['Equal variances','Levene\'s test p > 0.05.']],
  'Mixed (split-plot) ANOVA':[['Interval or ratio outcome','Same scale used at every time point.'],['Normal distribution in each group at each time point','Shapiro-Wilk p > 0.05.'],['Equal variances between groups','Levene\'s test p > 0.05 at each time point.'],['Equal covariances','Box\'s M test p > 0.001.'],['Sphericity','Mauchly\'s test p > 0.05. If violated, report the Greenhouse-Geisser correction.']],
  'Simple linear regression':[['Interval or ratio outcome','Check the level of measurement of the dependent variable.'],['Linear relationship','The scatterplot of predictor and outcome shows a straight-line pattern.'],['Independent residuals','Durbin-Watson between 1.5 and 2.5.'],['Equal spread of residuals (homoscedasticity)','Residuals versus predicted plot shows no funnel shape.'],['Normal residuals','Histogram or P-P plot of residuals.']],
  'Quade test (rank ANCOVA)':[['Ordinal, interval or ratio outcome and covariate','Normality is not required.'],['Independent groups','Each respondent belongs to only one group.'],['How to run it','Rank the posttest and pretest, regress the posttest ranks on the pretest ranks, then run a one-way ANOVA on the residuals.']],
  'Mann-Whitney U test':[['Ordinal, interval or ratio outcome','Normality is not required.'],['Independent groups','Each respondent belongs to only one group.'],['Similar shape of distribution','Needed if you want to report a difference in medians.']],
  'Wilcoxon signed-rank test':[['Ordinal, interval or ratio outcome','Normality is not required.'],['Paired observations','The same respondents are measured twice.'],['Differences roughly symmetric','Look at a histogram of the differences.']],
  'Kruskal-Wallis H test':[['Ordinal, interval or ratio outcome','Normality is not required.'],['Independent groups','Each respondent belongs to only one group.'],['Similar shape of distribution','Needed if you want to report a difference in medians. Follow a significant result with Dunn\'s post hoc test.']],
  'Friedman test':[['Ordinal, interval or ratio outcome','Normality is not required.'],['Same respondents at every time point','One group measured three or more times.']],
  'Spearman rank-order correlation (rho)':[['Ordinal, interval or ratio variables','Normality is not required.'],['Monotonic relationship','As one variable rises the other consistently rises or falls (scatterplot).'],['Paired scores','Each respondent has a score on both variables.']],
  'Chi-square test of independence':[['Both variables nominal or ordinal categories','Data are counts (frequencies), not scores.'],['Independent observations','Each respondent is counted in only one cell.'],['Expected count of at least 5','No more than 20% of cells below 5, none below 1. For a 2×2 table that fails this, use Fisher\'s exact test.']],
  'McNemar test':[['Two-category (yes/no) outcome','Data are counts.'],['Paired observations','The same respondents are classified before and after.']],
  'Cochran\'s Q test':[['Two-category (yes/no) outcome','Data are counts.'],['Same respondents at every time point','Three or more measurements.']],
  'Binary logistic regression':[['Two-category outcome','For example, readmitted or not readmitted.'],['Independent observations','Each respondent appears once.'],['No multicollinearity','VIF below 10 for each predictor.'],['Linearity of the logit','Box-Tidwell test for continuous predictors.'],['Enough cases','At least 10 events per predictor.']],
  'Ordinal logistic regression':[['Ordered categorical outcome','For example, low, moderate, high.'],['No multicollinearity','VIF below 10 for each predictor.'],['Proportional odds','Test of parallel lines p > 0.05.']]
